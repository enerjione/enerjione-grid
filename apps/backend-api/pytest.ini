[pytest]
# NEDEN VAR
# ---------
# `pytest-asyncio` bu ayar tanimli degilken her kosuda bir
# PytestDeprecationWarning basiyordu. Uyari SESSION BASLAMADAN, plugin
# yuklenirken ve STDERR'e yaziliyor.
#
# Bunun zararsiz gorunen ama gercek bir bedeli var: testleri PowerShell'den
# `& $py -m pytest -q 2>&1` gibi cagiran her betik yaniliyor. Windows
# PowerShell 5.1'de bir native komutun stderr'ini yonlendirmek her satiri
# NativeCommandError'a sarar; cagiran betik pytest 0 donmesine ragmen tam bu
# noktada duruyor. Yani "testler gecti" ile "betik yesil dondu" ayrisiyor.
#
# Deger, pytest-asyncio'nun gelecekteki VARSAYILANI ile ayni secildi; bugunku
# davranisla farki olmadigi tam test paketiyle dogrulandi.
asyncio_default_fixture_loop_scope = function
