# Alembic config — EnerjiOne backend-api.
#
# DB URL `env.py` icinde `settings.database_url`'tan okunur; bu dosyada
# placeholder kalir (`alembic` CLI ile cagrildiginda env.py override eder).
#
# Production deploy: `python -m scripts.migrate_db` kullanilir. Legacy sema
# yalniz 0006 olarak stamp edilir; sonraki revision'lar gercekten calistirilir.
# Yeni schema degisiklikleri `alembic revision --autogenerate -m "..."` ile uretilmeli.

[alembic]
script_location = alembic_migrations
# Iso8601 + branch label — dosyalar sirali ve okunabilir.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = UTC
# Hedef URL env.py'deki precedence ile secilir (acik URL >
# E1_MIGRATION_DATABASE_URL > settings.database_url). BOS BIRAKILMISTIR:
# dosyadan gelen bir deger "acikca verilmis hedef" sayilir ve digerlerini
# ezerdi.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
