# Alembic config — EnerjiOne backend-api.
#
# DB URL `env.py` icinde `settings.database_url`'tan okunur; bu dosyada
# placeholder kalir (`alembic` CLI ile cagrildiginda env.py override eder).
#
# Production deploy: container build sirasinda mevcut state'i `alembic stamp head`
# ile baseline'a esitleyin (eski create_all + ALTER TABLE IF NOT EXISTS akisi
# zaten schema'yi olusturduysa). Bundan sonraki tum schema degisiklikleri
# `alembic revision --autogenerate -m "..."` ile uretilmeli.

[alembic]
script_location = alembic_migrations
# Iso8601 + branch label — dosyalar sirali ve okunabilir.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = UTC
# sqlalchemy.url env.py tarafindan override edilir
sqlalchemy.url = postgresql+psycopg2://placeholder@localhost/placeholder

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
