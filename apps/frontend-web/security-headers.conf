# Guvenlik basliklari — TEK KAYNAK.
#
# NEDEN AYRI DOSYA:
#   nginx'te `add_header` MIRAS ALINMAZ: bir location blogunda BIR TANE
#   `add_header` varsa, o blok ust bloktaki `add_header`'larin HICBIRINI
#   almaz. Bu yuzden `Cache-Control` ekleyen statik-dosya location'lari ve
#   `Referrer-Policy`'yi ezen /setup-password blogu, CSP + HSTS +
#   X-Frame-Options + nosniff + Permissions-Policy basliklarini SESSIZCE
#   kaybediyordu (yani tum .js/.css dosyalari bu korumalar olmadan
#   servis ediliyordu).
#
#   Cozum: basliklari bu snippet'te tutup `add_header` iceren HER bloga
#   `include /etc/nginx/security-headers.conf;` ile eklemek. Yeni bir baslik
#   eklerken yalnizca burasi degisir.
#
# `always` flag: 4xx/5xx cevaplara da uygulanir; aksi halde sadece 2xx/3xx.

add_header X-Frame-Options                "DENY" always;
add_header X-Content-Type-Options         "nosniff" always;
add_header Referrer-Policy                "strict-origin-when-cross-origin" always;
add_header Permissions-Policy             "geolocation=(), microphone=(), camera=(), payment=()" always;

# HSTS: TLS termination'in disardan yapildigi senaryoda gonderilir.
# X-Forwarded-Proto=https olunca HSTS gondermek anlamli. 6 ay max-age.
add_header Strict-Transport-Security      "max-age=15768000; includeSubDomains" always;

# CSP: SPA + WebSocket + OpenStreetMap karolari.
# `default-src 'self'` baz; inline script yok (vite build tum JS'i .js
# dosyalarinda toplar). `'unsafe-inline'` style icin gerekli (Material
# Symbols + dinamik tema). WS icin connect-src 'self' yeterli (ayni origin).
# HARITA KAROLARI DIS HOST DEGIL: hepsi backend'in /api/v1/map-tiles/...
# adresinden gelir (once disk onbellegi, yoksa backend yukari akistan ceker).
# Bu sayede CSP daralabildi ve saha cihazi internet olmadan harita gosteriyor.
# Yeni harita saglayicisi eklerken burasi DEGISMEZ; backend'deki LAYERS'a eklenir.
# Material Symbols self-host (npm paketi); Google Fonts CDN izni kaldirildi —
# 4G sahada CDN blok riski + CSP daha siki.
# Rybbit Analytics (analytics.enerjione.com): script-src + connect-src izni.
add_header Content-Security-Policy        "default-src 'self'; script-src 'self' https://analytics.enerjione.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://analytics.enerjione.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
