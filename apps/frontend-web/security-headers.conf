# Guvenlik basliklari — TEK KAYNAK.
#
# NEDEN AYRI DOSYA:
#   nginx'te `add_header` MIRAS ALINMAZ: bir location blogunda BIR TANE
#   `add_header` varsa, o blok ust bloktaki `add_header`'larin HICBIRINI
#   almaz. Bu yuzden `Cache-Control` ekleyen statik-dosya location'lari ve
#   `Referrer-Policy`'yi ezen /setup-password blogu, CSP + HSTS +
#   X-Frame-Options + nosniff + Permissions-Policy basliklarini SESSIZCE
#   kaybediyordu (yani tum .js/.css dosyalari bu korumalar olmadan
#   servis ediliyordu).
#
#   Cozum: basliklari bu snippet'te tutup `add_header` iceren HER bloga
#   `include /etc/nginx/security-headers.conf;` ile eklemek. Yeni bir baslik
#   eklerken yalnizca burasi degisir.
#
# `always` flag: 4xx/5xx cevaplara da uygulanir; aksi halde sadece 2xx/3xx.

add_header X-Frame-Options                "DENY" always;
add_header X-Content-Type-Options         "nosniff" always;
add_header Referrer-Policy                "strict-origin-when-cross-origin" always;
add_header Permissions-Policy             "geolocation=(), microphone=(), camera=(), payment=()" always;

# HSTS: TLS termination'in disardan yapildigi senaryoda gonderilir.
# X-Forwarded-Proto=https olunca HSTS gondermek anlamli. 6 ay max-age.
add_header Strict-Transport-Security      "max-age=15768000; includeSubDomains" always;

# CSP: SPA + WebSocket + harita karolari.
# `default-src 'self'` baz; inline script yok (vite build tum JS'i .js
# dosyalarinda toplar). `'unsafe-inline'` style icin gerekli (Material
# Symbols + dinamik tema). WS icin connect-src 'self' yeterli (ayni origin).
# Material Symbols self-host (npm paketi); Google Fonts CDN izni kaldirildi —
# 4G sahada CDN blok riski + CSP daha siki.
# Analitik izni KALDIRILDI: urun izole/internetsiz aglarda calisiyor, istek
# her acilista basarisiz oluyordu ve musteri agindan disari cikma girisimi
# guvenlik denetiminde aciklanmasi gereken bir madde yaratiyordu.
# script-src ve connect-src artik yalnizca 'self'.
#
# HARITA KAROLARI — img-src'de DIS HOSTLAR VAR, BILINCLI:
#   Birincil yol hala backend'in /api/v1/map-tiles/... adresidir (once disk
#   onbellegi, yoksa yukari akis). Cevrimdisi harita bu sayede calisir.
#   ANCAK bu, haritayi backend yoluna bagimli hale getirmisti: nginx
#   yonlendirmesi, oturum cerezi ya da backend arizasi haritayi tamamen
#   karartiyordu — tarayicida internet olsa bile. Sahada bu "sistem bozuk"
#   gorunumu veriyor.
#   Bu yuzden istemci, proxy'den karo alamayinca DOGRUDAN yukari akisa duser
#   (bkz. src/components/ResilientTileLayer.tsx) ve o adreslerin burada izinli
#   olmasi gerekir. Aksi halde yedek yol CSP'ye takilir ve sessizce basarisiz
#   olur — kullanici yine bos harita gorur, ustelik sebebi daha da gizlenir.
#
#   BEDELI durustce: img-src artik yalnizca 'self' degil. Bu hostlar sadece
#   GORSEL yukleyebilir (script/connect degil), dolayisiyla etki alani dar.
#   Yeni harita saglayicisi eklenirse HEM backend'deki LAYERS'a HEM buraya
#   eklenmelidir.
add_header Content-Security-Policy        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://server.arcgisonline.com https://*.tile.opentopomap.org https://*.basemaps.cartocdn.com; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
