<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>EnerjiOne Grid Dashboard</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Material Symbols artik npm paketi (material-symbols) ile self-host
         ediliyor; main.tsx icinde import edilir. CDN bagimligi kaldirildi
         (4G sahada DNS/proxy bloku UI'yi kirmaz; ayrica CSP daha siki). -->
    <!-- Rybbit Analytics (self-hosted) — ziyaretci takibi.
         `async`, `defer` DEGIL: saha cihazi cogu zaman internetsizdir ve bu
         istek ERR_CONNECTION_TIMED_OUT'a kadar (~30 sn) asili kalir.
         `defer` ile tarayici DOMContentLoaded'i BEKLETIYORDU — arayuz saha
         kurulumlarinda gec aciliyordu. `async` ile istek arka planda kalir,
         zaman asimina ugrasa da uygulamanin acilmasini geciktirmez.
         Internetsiz cihazda konsolda tek bir basarisiz istek gorunur;
         analitigi tamamen kapatmak icin bu blogu silmek yeterli. -->
    <script
      src="https://analytics.enerjione.com/api/script.js"
      data-site-id="0eff3baa66db"
      async
    ></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
