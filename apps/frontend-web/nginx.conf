# Nginx — frontend SPA + backend reverse proxy.
#
# Tek konteyner, tek port (80). Browser sadece bu adresi gorur:
#   /              → React SPA (dist/)
#   /api/v1/...    → backend-api:8000 (Docker network'unde)
#   /api/v1/ws/... → backend-api:8000 (WebSocket; Upgrade header'i geciyor)
#
# Backend-api ayri bir host port acmaz; sadece compose network'unde gozukur.
# Boylece kullanicinin VDS'inde tek port (80 veya 443) gerekir.
#
# Guvenlik katmani (cati 0.x cutover sonrasi eklendi):
#   - Security header'lari (CSP, X-Frame-Options, X-Content-Type-Options,
#     Referrer-Policy, HSTS) tum cevaplara enjekte edilir.
#   - Login + auth endpoint'lerinde rate-limit (brute-force koruma).
#   - Hidden file'lar (.git, .env vs.) reddedilir.
#   - server_tokens off — nginx versiyonu fingerprint olarak sizdirilmez.
#   - HTTPS redirect: SSL termination disardan (Caddy/Traefik) yapilirsa
#     X-Forwarded-Proto=https header'i ile HSTS aktif olur.

# WebSocket icin Upgrade/Connection header mapping. $http_upgrade bos ise
# Connection da bos kalir (HTTP/1.1 keep-alive); upgrade istegi varsa
# Connection: upgrade gonderilir. Bu mapping nginx best-practice.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limit zone'lari — global IP basina (binary_remote_addr efficient key).
# `login_zone`: brute-force koruma; dakikada 5 deneme + burst 3.
# `api_zone`:   genel API koruma; saniyede 60 istek + burst 120 (operator UI
#               agresif istekler atabilir, sinir asilirsa 503).
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/s;

# nginx versiyonu Server header'inda gozukmesin (fingerprint koruma).
server_tokens off;

server {
    # nginx-unprivileged image uid=101 (nginx user) ile calisir; port 80
    # bind'i icin root yetkisi gerek → 8080'e tasidik. Compose host port
    # mapping `80:8080` ile dis dunyada hala 80 portu kalir.
    listen 8080 default_server;
    server_name _;

    # Buyuk istekler (compose download, batch ingest) icin makul limit.
    client_max_body_size 10m;

    # ---- Security headers (her cevaba enjekte) -----------------------------
    # `always` flag: 4xx/5xx cevaplara da uygulanir; aksi halde sadece 2xx/3xx.
    add_header X-Frame-Options                "DENY" always;
    add_header X-Content-Type-Options         "nosniff" always;
    add_header Referrer-Policy                "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy             "geolocation=(), microphone=(), camera=(), payment=()" always;
    # HSTS: TLS termination'in disardan yapildigi senaryoda gonderilir.
    # X-Forwarded-Proto=https olunca HSTS gondermek anlamli. 6 ay max-age.
    add_header Strict-Transport-Security      "max-age=15768000; includeSubDomains" always;
    # CSP: SPA + WebSocket + Google Fonts + OpenStreetMap tile'lari.
    # `default-src 'self'` baz; inline script yok (React vite build'i tum JS'i
    # .js dosyalarinda toplar). `'unsafe-inline'` style icin gerekli (Material
    # Symbols + dinamik tema). WS icin connect-src `ws: wss: 'self'`.
    # `img-src` icin: kendi assetler + data: (canvas, base64), blob: (download
    # link'leri). HARITA KAROLARI ARTIK DIS HOST DEGIL: hepsi backend'in
    # /api/v1/map-tiles/... adresinden gelir (once disk onbellegi, yoksa
    # backend yukari akistan ceker). Bu sayede CSP daralabildi ve saha
    # cihazi internet olmadan da harita gosterebiliyor. Yeni bir harita
    # saglayicisi eklerken burasi DEGISMEZ; backend'deki LAYERS'a eklenir.
    # connect-src 'self' — WebSocket upgrade aynı origin'den gelir.
    # Material Symbols artik self-host (material-symbols npm paketi); Google
    # Fonts CDN izni kaldirildi — 4G sahada CDN blok riski + CSP daha siki.
    # Rybbit Analytics (analytics.enerjione.com): script-src + connect-src izni
    add_header Content-Security-Policy        "default-src 'self'; script-src 'self' https://analytics.enerjione.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://analytics.enerjione.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # SPA static
    root /usr/share/nginx/html;
    index index.html;

    # ---- Hidden file deny (.git, .env, .htaccess vs.) ----------------------
    # well-known disindaki tum dot-file'lara 404 don. Kaynak code/secret
    # disclosure'i (orn. /.git/config) kapatir.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # WebSocket — /api/v1/ws/ prefix'i (live-values, vb).
    # Burada Upgrade + Connection header'lari backend'e gecirilir; aksi halde
    # FastAPI WS endpoint upgrade tamamlayamaz ve 502/timeout olur.
    # MUTLAKA /api/ location'indan ONCE tanimlanmali ki nginx bu prefix'i
    # tercih etsin (uzun match kuralı).
    location /api/v1/ws/ {
        proxy_pass http://backend-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WS connection'lar uzun-omurlu olur; default 60sn idle ile drop
        # olmasin diye 1 saat. Backend her 30sn ping gonderir, bu yeterli.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 30s;
    }

    # ---- Login endpoint'i — brute-force koruma (rate-limit) ----------------
    # Backend'de slowapi 10/dakika; nginx 5/dakika + burst 3 (toplam ~8 cap)
    # ile katmanli savunma. 429 cevap kullaniciya "Cok hizli deneme, beklemiyi
    # gerek" mesajini gonderir.
    location = /api/v1/auth/login {
        limit_req zone=login_zone burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend-api:8000/api/v1/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Harita karolari — /api/ ile AYNI backend, ama rate-limit YOK.
    # Tek bir harita ekrani acilirken saniyeler icinde yuzlerce karo ister;
    # genel API limiti (60r/s) normal kullanimda bile 429 uretirdi. Karolar
    # salt-okunur ve pahali degil (cogu diskten gelir).
    location /api/v1/map-tiles/ {
        proxy_pass http://backend-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ilk kez cekilen karo yukari akistan gelir; onun timeout'u kadar bekle.
        proxy_read_timeout 60s;
    }

    # Backend API — ayni-origin reverse proxy
    location /api/ {
        # Genel API rate-limit (60r/s burst 120). Operator UI agresif istek
        # atabilir; sinirin altinda kalir, saldirgan icin cap.
        limit_req zone=api_zone burst=120 nodelay;
        limit_req_status 429;

        proxy_pass http://backend-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uzun suren upload/akislar icin generous timeout.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;
    }

    # SPA fallback — React Router/refresh icin
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /setup-password?token=... — token URL'de gelir. `Referrer-Policy: no-referrer`
    # ile bu sayfadan baska bir kaynaga gidilirken Referer header'inda token
    # sizmasin. Genel ayar `strict-origin-when-cross-origin`; setup sayfasi
    # icin sertlestiriyoruz.
    location = /setup-password {
        try_files $uri /index.html;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Static asset cache — sadece vite-build hash'li dosyalar icin.
    # Hash'siz dosyalar (logo.png, favicon.ico) immutable cache'lenmemeli;
    # operator logo degistirdiginde browser hala eski versiyonu gormesin.
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        # Logo/favicon gibi hash'siz dosyalar — kisa cache (1 saat) ki
        # operator settings degisikligi cabuk goruntulensin.
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Gzip — bundle.js, css icin ~%70 boyut kazanci.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/plain
        text/xml;
}
