# Nginx — frontend SPA + backend reverse proxy.
#
# Tek konteyner, tek port (80). Browser sadece bu adresi gorur:
#   /              → React SPA (dist/)
#   /api/v1/...    → backend-api:8000 (Docker network'unde)
#   /api/v1/ws/... → backend-api:8000 (WebSocket; Upgrade header'i geciyor)
#
# Backend-api ayri bir host port acmaz; sadece compose network'unde gozukur.
# Boylece kullanicinin VDS'inde tek port (80 veya 443) gerekir.
#
# Guvenlik katmani (cati 0.x cutover sonrasi eklendi):
#   - Security header'lari (CSP, X-Frame-Options, X-Content-Type-Options,
#     Referrer-Policy, HSTS) tum cevaplara enjekte edilir.
#   - Login + auth endpoint'lerinde rate-limit (brute-force koruma).
#   - Hidden file'lar (.git, .env vs.) reddedilir.
#   - server_tokens off — nginx versiyonu fingerprint olarak sizdirilmez.
#   - HTTPS redirect: SSL termination disardan (Caddy/Traefik) yapilirsa
#     X-Forwarded-Proto=https header'i ile HSTS aktif olur.

# WebSocket icin Upgrade/Connection header mapping. $http_upgrade bos ise
# Connection da bos kalir (HTTP/1.1 keep-alive); upgrade istegi varsa
# Connection: upgrade gonderilir. Bu mapping nginx best-practice.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- Gercek istemci semasi (http/https) -----------------------------------
# Bu nginx cogu kurulumda bir UST katmanin (host nginx / Caddy) arkasindadir
# ve TLS orada sonlandirilir. Asagidaki proxy bloklari onceden
# `X-Forwarded-Proto $scheme` gonderiyordu; `$scheme` BU nginx'in kendi
# semasidir (8080 uzerinde daima "http"), dolayisiyla ust katmanin
# gonderdigi "https" EZILIYORDU.
#
# Bunun somut sonucu: backend istegi HTTP saniyor ve oturum cerezine `Secure`
# bayragini koymuyor. Yani HTTPS ile yayinlanan bir kurulumda cerez duz
# HTTP'de de gonderilebilir hale gelirdi.
#
# `map` ust katmanin degerini KORUR; ust katman yoksa kendi semamiza duser.
map $http_x_forwarded_proto $e1_forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

# ---- Gercek istemci IP'si (rate-limit'in DOGRU calismasi icin sart) --------
# Bu nginx cogu kurulumda bir ust katmanin (host nginx / Caddy / Traefik)
# arkasindadir; bkz. infra/host-nginx/enerjione-grid.conf -> 127.0.0.1:8080.
# O durumda $remote_addr TUM istekler icin 127.0.0.1 olur ve asagidaki
# limit_req zone'lari IP BASINA degil GLOBAL calisir:
#   * login_zone 5r/m  -> tek bir kotu niyetli istemci dakikada 5 denemeyle
#     HERKESIN girisini kilitler (DoS),
#   * api_zone 60r/s   -> es zamanli operatorler ayni kovayi paylasir ve
#     normal kullanimda 429 yerler.
# `real_ip_header X-Forwarded-For` + `real_ip_recursive on` ile $remote_addr
# zincirdeki gercek istemciye ayarlanir. `set_real_ip_from` YALNIZCA guvenilen
# proxy'leri listeler; listede olmayan bir kaynaktan gelen XFF'e GUVENILMEZ
# (aksi halde saldirgan basligi uydurup limitten kacardi).
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
# Docker bridge araliklari — ust katman ayni host'ta bir container ise.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Rate limit zone'lari — gercek istemci IP'si basina (binary_remote_addr
# efficient key; yukaridaki real_ip ayari sayesinde artik dogru IP).
# `login_zone`: brute-force koruma; dakikada 5 deneme + burst 3.
# `api_zone`:   genel API koruma; saniyede 60 istek + burst 120 (operator UI
#               agresif istekler atabilir, sinir asilirsa 429).
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/s;

# nginx versiyonu Server header'inda gozukmesin (fingerprint koruma).
server_tokens off;

server {
    # nginx-unprivileged image uid=101 (nginx user) ile calisir; port 80
    # bind'i icin root yetkisi gerek → 8080'e tasidik. Compose host port
    # mapping `80:8080` ile dis dunyada hala 80 portu kalir.
    listen 8080 default_server;
    server_name _;

    # ---- BACKEND ADRESI CALISMA ANINDA COZULUR -----------------------------
    # YASANAN ARIZA (iki kez): `backend-api` container'i yeniden YARATILINCA
    # yeni bir IP alir. nginx ise upstream adresini YALNIZCA BASLANGICTA
    # cozup saklar; frontend ayakta kaldigi surece OLU adrese gitmeye devam
    # eder ve arayuz `502 Bad Gateway` doner.
    #
    # Kullanici tarafindan gorunusu: "guncelleme sonrasi giremiyorum" /
    # "her sey gitti". Teshisi ZOR, cunku her sey saglikli gorunur:
    #     backend-api  -> Up (healthy), /health 200 (container ICINDEN)
    #     postgres     -> healthy
    #     loglarda     -> tek bir hata YOK
    # Yalnizca nginx UZERINDEN gecen istek 502 doner.
    #
    # `update.sh`'a "backend yeniden yaratildiysa frontend'i de restart et"
    # eklenmisti — ama o yalnizca guncelleme akisini korur. Operator (ya da
    # bakim yapan biri) elle `docker compose up -d` calistirinca koruma
    # DEVREYE GIRMEZ ve ayni 502 geri gelir. Bu tam olarak yasandi.
    #
    # KALICI COZUM: proxy_pass'te DEGISKEN kullanmak. nginx degisken gorunce
    # adresi HER ISTEKTE resolver uzerinden yeniden cozer. Docker'in gomulu
    # DNS'i 127.0.0.11'dedir; `valid=10s` ile en fazla 10 saniye eski adres
    # kullanilir.
    #
    # ipv6=off: Docker DNS bazi kurulumlarda AAAA icin bos yanit doner ve
    # nginx cozumu basarisiz sayar. IPv4 yeterli, kapatiyoruz.
    #
    # DAVRANIS DEGISMEZ: asagidaki bes `proxy_pass`in hepsi KIMLIK
    # eslemesiydi (istek yolu oldugu gibi backend'e gidiyordu). Degiskenli
    # bicimde URI YAZILMAZ; nginx orijinal istek yolunu aynen gecirir.
    # URI yazilsaydi TUM istekler o tek yola giderdi — sessiz ve yikici bir
    # hata olurdu.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $e1_backend http://backend-api:8000;

    # Buyuk istekler (compose download, batch ingest) icin makul limit.
    # Yedek yukleme bunun DISINDA — asagidaki `^~ /api/v1/backups/` blogu.
    client_max_body_size 10m;

    # ---- Security headers (her cevaba enjekte) -----------------------------
    # Basliklarin govdesi security-headers.conf'ta; TEK KAYNAK.
    # DIKKAT: nginx'te `add_header` MIRAS ALINMAZ — kendi `add_header`'i olan
    # her location bu include'u TEKRAR etmek zorunda, aksi halde o yol
    # basliksiz kalir. Asagida Cache-Control ekleyen statik bloklar ve
    # /setup-password bunu yapiyor.
    include /etc/nginx/security-headers.conf;

    # SPA static
    root /usr/share/nginx/html;
    index index.html;

    # ---- Hidden file deny (.git, .env, .htaccess vs.) ----------------------
    # well-known disindaki tum dot-file'lara 404 don. Kaynak code/secret
    # disclosure'i (orn. /.git/config) kapatir.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # WebSocket — /api/v1/ws/ prefix'i (live-values, vb).
    # Burada Upgrade + Connection header'lari backend'e gecirilir; aksi halde
    # FastAPI WS endpoint upgrade tamamlayamaz ve 502/timeout olur.
    # MUTLAKA /api/ location'indan ONCE tanimlanmali ki nginx bu prefix'i
    # tercih etsin (uzun match kuralı).
    location /api/v1/ws/ {
        proxy_pass $e1_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $e1_forwarded_proto;

        # WS connection'lar uzun-omurlu olur; default 60sn idle ile drop
        # olmasin diye 1 saat. Backend her 30sn ping gonderir, bu yeterli.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 30s;
    }

    # ---- Login endpoint'i — brute-force koruma (rate-limit) ----------------
    # Backend'de slowapi 10/dakika; nginx 5/dakika + burst 3 (toplam ~8 cap)
    # ile katmanli savunma. 429 cevap kullaniciya "Cok hizli deneme, beklemiyi
    # gerek" mesajini gonderir.
    location = /api/v1/auth/login {
        limit_req zone=login_zone burst=3 nodelay;
        limit_req_status 429;

        proxy_pass $e1_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $e1_forwarded_proto;
    }

    # Harita karolari — /api/ ile AYNI backend, ama rate-limit YOK.
    # Tek bir harita ekrani acilirken saniyeler icinde yuzlerce karo ister;
    # genel API limiti (60r/s) normal kullanimda bile 429 uretirdi. Karolar
    # salt-okunur ve pahali degil (cogu diskten gelir).
    #
    # `^~` ZORUNLU — SUS DEGIL. Karo yolu ".png" ile biter ve asagidaki
    # `location ~* \.(...|png|...)$` REGEX blogu ile eslesir. nginx'te regex
    # location'lar DUZ PREFIX location'lari EZER (siralama fark etmez):
    # eslesme sirasi = exact (`=`) > `^~` prefix > regex > duz prefix.
    # `^~` olmadan her karo istegi statik blokta `try_files $uri =404`'e
    # dusuyordu; istek backend'e HIC ULASMIYORDU ve sistemdeki TUM haritalar
    # bos kaliyordu (tarayicida internet olsa bile). `npm run dev`de bu kural
    # olmadigi icin sorun yalnizca Docker/nginx kurulumunda gorunuyordu.
    location ^~ /api/v1/map-tiles/ {
        proxy_pass $e1_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $e1_forwarded_proto;
        # Ilk kez cekilen karo yukari akistan gelir; onun timeout'u kadar bekle.
        proxy_read_timeout 60s;
    }

    # Backend API — ayni-origin reverse proxy
    #
    # ---- Yedek yukleme / indirme — FELAKET KURTARMANIN TEK UI ADIMI --------
    #
    # YASANAN ARIZA: zincirdeki EN DUSUK deger kazanir ve o bu dosyaydi.
    #   ic nginx (burasi) : 10 MB   <- kazanan
    #   host nginx        : 100 MB
    #   backend           : 2 GiB   (_BACKUP_UPLOAD_MAX_BYTES)
    # Backend'in streaming/413 mantigi HIC calismiyordu; istek uvicorn'a
    # ulasmadan nginx'in HTML 413'uyle reddediliyor, frontend JSON bekledigi
    # icin kullaniciya anlamsiz genel bir hata gosteriliyordu. Yani felaket
    # kurtarmanin tek arayuz adimi calismiyordu — ve bu ancak gercekten
    # kurtarma gerektiginde fark edilirdi.
    #
    # SADECE LIMITI YUKSELTMEK YETMEZ: bu container `read_only: true` ve
    # `tmpfs /tmp size=64m` altinda calisiyor (compose x-hardened-worker).
    # nginx varsayilan olarak istek govdesini diske tamponlar; 64 MiB'lik
    # tmpfs'te 2 GB'lik bir yukleme yine patlardi. `proxy_request_buffering
    # off` govdeyi dogrudan backend'e akitir. Ayni sekilde indirme yonunde
    # `proxy_buffering off` proxy temp dosyasi yazilmasini onler.
    # YOL, ROUTER PREFIX'I ILE AYNI OLMALI: `backups.py` prefix'i
    # `/admin/backups`, `api_prefix` ise `/api/v1` — yani gercek yol
    # `/api/v1/admin/backups/`. Bu blok bir donem `/api/v1/backups/` yazdigi
    # icin HIC ESLESMIYORDU: istekler asagidaki genel `^~ /api/` blogundan
    # geciyor, server duzeyindeki 10 MB limiti gecerli oluyordu. Yani
    # yukaridaki duzeltme yazilmis ama YANLIS YOLA yazilmis, felaket
    # kurtarma yuklemesi kapali kalmisti (denetim 2026-08-13).
    # Bekcisi: apps/frontend-web/tests/nginxYedekYolu.test.ts
    location ^~ /api/v1/admin/backups/ {
        limit_req zone=api_zone burst=120 nodelay;
        limit_req_status 429;

        # Backend tavani ile AYNI (2 GiB). Buyuk olursa backend'in kendi
        # streaming kontrolu 413 uretir — dogru katman orasi.
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_pass $e1_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $e1_forwarded_proto;

        # Restore uzun surer (pg_restore + dogrulama); 4G hattinda yukleme de.
        proxy_read_timeout    1800s;
        proxy_send_timeout    1800s;
        proxy_connect_timeout 30s;
    }

    # `^~`: asagidaki statik-varlik regex'i API yollarini ASLA yakalamasin.
    # Harita karolarinda tam olarak bu oldu (bkz. yukaridaki blok). Bugun
    # baska bir API yolu ".svg"/".png" ile bitmiyor, ama biten bir uc
    # eklendigi gun sessizce 404 verirdi ve sebebi backend'de aranirdi.
    # `= /api/v1/auth/login` (exact) ve daha uzun `^~` prefix'ler bundan
    # etkilenmez; nginx once onlari secer.
    location ^~ /api/ {
        # Genel API rate-limit (60r/s burst 120). Operator UI agresif istek
        # atabilir; sinirin altinda kalir, saldirgan icin cap.
        limit_req zone=api_zone burst=120 nodelay;
        limit_req_status 429;

        proxy_pass $e1_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $e1_forwarded_proto;

        # Uzun suren upload/akislar icin generous timeout.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;
    }

    # index.html ONBELLEKLENMEZ.
    #
    # Bundle dosyalari hash'li ve `immutable` (7 gun); YENI SURUMU ISARET
    # EDEN TEK DOSYA index.html'dir. Uzerinde acik bir Cache-Control
    # olmadigi icin tarayici SEZGISEL onbellekleme uyguluyordu (yalnizca
    # ETag/Last-Modified): deploy sonrasi eski index.html yeniden
    # dogrulanmadan kullanilabiliyor ve ESKI bundle yukleniyordu.
    #
    # Bedeli: eski arayuz YENI backend ile konusur. Alanlar surumler
    # arasinda yer degistirdiginde (or. 2.73.0'da `top_rules` /
    # `flapping_devices` system-health'ten device-health'e tasindi) eski
    # arayuz olmayan alani okur ve ekran "Beklenmeyen bir hata" ile duser.
    # Operatorun tek caresi sert yenileme olur — bunu operatore birakmayiz.
    #
    # Dosya birkac KB; `no-store` bedeli yok.
    location = /index.html {
        # ZORUNLU: bu blokta add_header var, dolayisiyla server duzeyindeki
        # guvenlik basliklari MIRAS ALINMAZ (bkz. asagidaki statik bloklar).
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback — React Router/refresh icin.
    # `try_files` son argumani bir URI oldugu icin ic yonlendirme yapar ve
    # location eslesmesi TEKRAR kosar: index.html yukaridaki bloga duser,
    # dolayisiyla no-store basligini alir.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /setup-password?token=... — token URL'de gelir. `Referrer-Policy: no-referrer`
    # ile bu sayfadan baska bir kaynaga gidilirken Referer header'inda token
    # sizmasin. Genel ayar `strict-origin-when-cross-origin`; setup sayfasi
    # icin sertlestiriyoruz.
    location = /setup-password {
        try_files $uri /index.html;
        # Ortak basliklar (CSP/HSTS/nosniff/X-Frame-Options) — include olmadan
        # bu blok asagidaki add_header yuzunden hicbirini almazdi.
        include /etc/nginx/security-headers.conf;
        # Token URL'de geldigi icin bu sayfadan disa cikista Referer'da
        # sizmamali: en kisitli deger.
        #
        # SIRA ONEMLI: nginx add_header'i BIRIKTIRIR, ezmez — cevapta iki
        # Referrer-Policy basligi bulunur. Referrer Policy spec'i coklu deger
        # geldiginde "SON gecerli politikayi" uygular (en kisitlayiciyi degil).
        # Bu satir include'dan SONRA geldigi icin `no-referrer` kazanir.
        # Satirlarin yerini degistirmeyin; include asagiya alinirsa politika
        # sessizce `strict-origin-when-cross-origin`'e duser.
        add_header Referrer-Policy "no-referrer" always;
    }

    # Static asset cache — sadece vite-build hash'li dosyalar icin.
    # Hash'siz dosyalar (logo.png, favicon.ico) immutable cache'lenmemeli;
    # operator logo degistirdiginde browser hala eski versiyonu gormesin.
    #
    # security-headers include'u ZORUNLU: bu bloklarda `add_header
    # Cache-Control` var, dolayisiyla server-level basliklar miras ALINMAZ.
    # Include olmadan tum .js/.css dosyalari CSP/nosniff/X-Frame-Options
    # olmadan servis edilir.
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
    # DIKKAT: bu REGEX blok, uzantisi eslesen HER yolu yakalar ve duz prefix
    # location'lari EZER. Proxy'lenmesi gereken bir yol bu uzantilardan biriyle
    # bitiyorsa, o location `^~` ile isaretlenmelidir — yoksa istek arka uca
    # gitmez, statik kokte aranir ve 404 doner.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        # Logo/favicon gibi hash'siz dosyalar — kisa cache (1 saat) ki
        # operator settings degisikligi cabuk goruntulensin.
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Gzip — bundle.js, css icin ~%70 boyut kazanci.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/plain
        text/xml;
}
