# Nginx — frontend SPA + backend reverse proxy.
#
# Tek konteyner, tek port (80). Browser sadece bu adresi gorur:
#   /              → React SPA (dist/)
#   /api/v1/...    → backend-api:8000 (Docker network'unde)
#
# Backend-api ayri bir host port acmaz; sadece compose network'unde gozukur.
# Boylece kullanicinin VDS'inde tek port (80 veya 443) gerekir.

server {
    listen 80;
    server_name _;

    # Buyuk istekler (compose download, batch ingest) icin makul limit.
    client_max_body_size 10m;

    # SPA static
    root /usr/share/nginx/html;
    index index.html;

    # Backend API — ayni-origin reverse proxy
    location /api/ {
        proxy_pass http://backend-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uzun suren upload/akislar icin generous timeout.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;
    }

    # SPA fallback — React Router/refresh icin
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset cache
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
