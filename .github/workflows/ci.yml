# CI — her PR ve main push'unda calisir.
#
# Amac: "main her an release edilebilir" garantisi. Release workflow'u bu
# kontrollerin gectigini varsayar; burada yakalanmayan hata sahaya gider.
#
# Isler bilerek AYRI job: biri kirildiginda digerlerinin sonucunu da gormek
# istiyoruz (tek job'da ilk hata kalanlari maskeler).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Ayni dal icin ust uste push atilirsa eskisini iptal et — runner israfi olmasin.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — typecheck + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend-web/package-lock.json
      - name: Bagimliliklar (npm ci — lockfile birebir)
        working-directory: apps/frontend-web
        run: npm ci
      # `npm run build` = `tsc -b && vite build`. Ayri `tsc --noEmit` KOSMUYORUZ:
      # gecmiste --noEmit'in kacirdigi bir hatayi vite build yakalamisti, yani
      # asil kapi build. Typecheck zaten build'in ilk adimi.
      - name: Build (tsc -b + vite build)
        working-directory: apps/frontend-web
        run: npm run build
      # Saf mantik testleri (esbuild + node:test). Yeni bagimlilik YOK; bkz.
      # apps/frontend-web/tests/run.mjs. Denetimdeki "Frontend: sifir test"
      # maddesinin ilk kapanan parcasi.
      - name: Test (node:test)
        working-directory: apps/frontend-web
        run: npm test

  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest
    # NATS servisi — WS fan-out koprusunun testleri GERCEK bir NATS ister.
    # Olmadan `tests/test_ws_fanout_bridge.py` skipif ile SESSIZCE atlaniyordu:
    # coklu surece gecisin tek koruyucu testi hicbir CI kosusunda kosmuyordu.
    # Bu, "test var" sanip korumasiz kalmanin klasik ornegi.
    services:
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend-api/requirements.txt
      - name: Bagimliliklar
        working-directory: apps/backend-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff (gercek hata kurallari)
        run: ruff check .
      - name: pytest
        working-directory: apps/backend-api
        run: pytest -q

  safe-restore-integration:
    # GUVENLI RESTORE — GERCEK VERITABANI UZERINDE KABUL TESTLERI.
    #
    # NEDEN AYRI IS: bu testler gercek bir PostgreSQL kumesinde veritabani
    # yaratip yeniden adlandiriyor ve `pg_restore` calistiriyor; normal
    # birim paketini yavaslatmamasi icin ayrildi.
    #
    # NEDEN BU IMAJ: uretimde `timescale/timescaledb:2.17.2-pg16` kosuyor.
    # Restore davranisi surume duyarli — olculdu: `pg_restore` 18 bir PG16
    # sunucuya restore YAPAMIYOR ("unrecognized configuration parameter
    # transaction_timeout"). Dolayisiyla kabul yalnizca uretimdeki ana
    # surumde verilebilir; istemci de ayni ana surumden kurulur.
    name: Guvenli restore — PG16 + TimescaleDB
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend-api/requirements.txt
      - name: PostgreSQL 16 istemcisi
        # Sunucuyla AYNI ana surum. Runner'in varsayilan istemcisi daha yeni
        # olabilir ve o birlesim restore'u dusurur (yukaridaki not).
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc             | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc]             http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main"             | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          pg_restore --version
      - name: Bagimliliklar
        working-directory: apps/backend-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Kabul ortamini dogrula (PG16 + TimescaleDB 2.17.2)
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -c "SELECT version();"
          psql -h 127.0.0.1 -U postgres -d postgres             -c "CREATE EXTENSION IF NOT EXISTS timescaledb;"             -tAc "SELECT extversion FROM pg_extension WHERE extname='timescaledb';"
      - name: Guvenli restore integration testleri
        working-directory: apps/backend-api
        env:
          E1_TEST_PG_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/postgres
        run: pytest tests/integration -q -p no:randomly

  alarm-service:
    # Bu servisin CI'da HIC test kapsami yoktu; yalnizca backend-api
    # kosuluyordu. Denetim raporundaki A5 (ornek tamponu 512M container
    # limitini asip birkac saatte OOM-kill'e goturuyordu) tam da bu yuzden
    # kimsenin fark etmedigi bir davranisti. Kural motoru sahada alarm
    # uretmekten sorumlu; testsiz birakilacak son yer burasi.
    name: Alarm service — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/alarm-service/requirements.txt
      - name: Bagimliliklar
        working-directory: apps/alarm-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: pytest
        working-directory: apps/alarm-service
        run: pytest -q

  iec104-outbound:
    # SCADA cikisi. Testleri VARDI ama CI'da hic kosmuyordu — yani sozde
    # korumaliydi. Denetimdeki A7 (yari-acik oturumda k-penceresi kilitlenip
    # tum telemetrinin sessizce dusmesi) tam da kimsenin kosturmadigi bir
    # alanda duruyordu.
    name: IEC 104 outbound — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/iec104-outbound/requirements.txt
      - name: Bagimliliklar
        working-directory: apps/iec104-outbound
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: pytest
        working-directory: apps/iec104-outbound
        run: pytest -q

  modbus-outbound:
    # Modbus TCP yayini. Testleri VARDI ama CI'da kosmuyordu ve dahasi:
    # yardimci `check()` fonksiyonu ASSERT ETMIYORDU (yalnizca bir listeye
    # not dusuyordu), yani uc "test" icindeki kontrollerin hepsi patlasa
    # bile pytest'te yesil kaliyordu. Uctan uca TCP testi ise `async def`
    # oldugu ve pakette pytest-asyncio olmadigi icin HIC kosmuyordu.
    # Yani "4 test var" ciktisi tamamen aldaticiydi.
    name: Modbus outbound — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/modbus-outbound/requirements.txt
      - name: Bagimliliklar
        working-directory: apps/modbus-outbound
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: pytest
        working-directory: apps/modbus-outbound
        run: pytest -q

  ftp-server:
    # Cihazlarin config/firmware yazdigi FTP sunucusu. Testleri 2.92.0'da
    # eklendi ve is buraya AYNI ANDA konuldu: CI'da kosmayan bir bekci
    # testi, bekciligini yalnizca yazildigi gun yapar.
    #
    # Kritik test `test_baglanti_olmadan_da_atis_gelir`: kalp atisinin
    # TRAFIKTEN BAGIMSIZ oldugunu kilitler. Bozulursa hicbir cihaz
    # baglanmayan sakin bir gecede saglikli servis yeniden baslatilir —
    # cozdugumuz sorundan daha kotu bir ariza.
    name: FTP sunucusu — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/ftp-server/requirements.txt
      - name: Bagimliliklar
        working-directory: apps/ftp-server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: pytest
        working-directory: apps/ftp-server
        run: pytest -q

  whatsapp-gateway:
    # WhatsApp gecidi (Node). Bekci burada worker_threads ile kosuyor cunku
    # Node tek iplikli: `setInterval` ile ayni olay dongusune konsaydi,
    # dongu kilitlendiginde bekci de donmaz ve yakalamasi gereken tek
    # arizayi yakalayamazdi.
    #
    # Test GERCEK cocuk surec doguruyor: `SIGKILL` cagrisinin gercekten tum
    # sureci indirdigini baska turlu dogrulamak mumkun degil. Ayni dosya
    # "saglikli surec OLDURULMEZ" durumunu da kilitliyor.
    #
    # `npm ci` bugunku testler icin gereksiz gorunebilir (test yalnizca node
    # yerlesiklerini kullaniyor) ama bilincli: hem lockfile ile package.json
    # ayrismasini yakalar, hem de baileys'e dokunan bir test eklendiginde
    # is sessizce kirilmaz.
    name: WhatsApp gecidi — node:test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/whatsapp-web-gateway/package-lock.json
      - name: Bagimliliklar (npm ci — lockfile birebir)
        working-directory: apps/whatsapp-web-gateway
        run: npm ci
      - name: node:test
        working-directory: apps/whatsapp-web-gateway
        run: npm test

  migrations:
    name: Alembic — tek head kontrolu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Alembic kur
        run: pip install alembic
      # Iki dal ayni anda migration urettiginde zincir catallanir ve `upgrade
      # head` "Multiple head revisions" ile patlar — bunu MERGE ONCESI yakala.
      # `alembic heads` DB'ye baglanmaz, sadece versions/ dizinini okur.
      - name: Tek head mi?
        working-directory: apps/backend-api
        run: |
          set -euo pipefail
          heads="$(alembic heads 2>/dev/null | grep -c '(head)' || true)"
          echo "Bulunan head sayisi: ${heads}"
          alembic heads
          if [ "${heads}" != "1" ]; then
            echo "::error::Alembic zinciri catallanmis (${heads} head). 'alembic merge heads' ile birlestirin."
            exit 1
          fi

  scripts:
    name: Kurulum scriptleri — syntax + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Saha kurulumu bu scriptlere bagli; bir syntax hatasi mini PC'de
      # kurulumu yarida birakir. Once ucuz kontrol (bash -n), sonra shellcheck.
      - name: bash -n
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::bash syntax hatasi"; fail=1; }
          done < <(git ls-files '*.sh')
          exit $fail
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091: source edilen dosyayi CI'da cozemiyor (runtime'da var).
          # Ciddi bulgular (error) kapi; uyarilar rapor.
          git ls-files '*.sh' | xargs shellcheck -e SC1091 -S error
      # Sozdizimi dogru olan bir betik yanlis DAVRANABILIR. Guncelleme
      # yarida kalinca `.env` surumunun geri alinmasi (denetim A8) tam da
      # boyle bir sey: hatasiz calisir ama cihazi ilk reboot'ta oldururdu.
      - name: update.sh surum geri alma davranisi
        run: bash infra/scripts/linux/tests/test-update-version-rollback.sh "$PWD"
      # Update oncesi yedeklerin rotasyonu (denetim A12). Bu dosyalar hicbir
      # zaman silinmiyordu ve sahada diski dolduran kalemdi; rotasyon sessizce
      # kirilirsa ariza yalnizca aylar sonra, dolu bir diskte gorunur.
      - name: Pre-update yedek rotasyonu
        run: bash infra/scripts/linux/tests/test-pre-update-backup-rotation.sh "$PWD"
      # NATS TLS hazirlama. TLS'in calismasi UC seyin ayni anda dogru olmasina
      # bagli (sertifika, NATS_CA_FILE, NATS_URL* semasi) ve yarim kalirsa
      # ariza SESSIZ: NATS healthcheck'i TLS'siz izleme portunu prob ettigi
      # icin container "healthy" gorunur ama backend el sikisamaz.
      - name: NATS TLS hazirlama davranisi
        run: bash infra/scripts/linux/tests/test-nats-tls-prepare.sh "$PWD"
      # Yarim kalan kurulumun geri alinmasi. Asil risk TERS YONDE: temizlik
      # fazla agresif olursa mevcut kurulumun MUSTERI VERISINI siler.
      - name: Kurulum geri alma davranisi
        run: bash infra/scripts/linux/tests/test-install-rollback.sh "$PWD"
      # `pipefail` + `| head` zamanlamaya bagli cikis kodu 2 uretir; v2.38.0
      # yayin isi tam olarak boyle dustu (imajlar yayinlanmisti).
      - name: pipefail + head tuzagi
        run: bash infra/scripts/linux/tests/test-pipefail-head.sh "$PWD"
      # Kiosk splash'i snap tarayicinin OKUYABILECEGI yerde olmali. Sahada
      # ekranda "File not found" cikti; dosya diskte duruyordu ama Firefox
      # snap oldugu icin /usr/local altini goremiyordu.
      - name: Kiosk gecis ekrani erisilebilirligi
        run: bash infra/appliance/tests/test-kiosk-splash.sh "$PWD"
      # Backend yeniden yaratilinca nginx eski IP'ye gider ve arayuz 502
      # verir; sahada "guncelleme sonrasi giris yapamiyorum" olarak doner.
      - name: Guncellemede frontend nginx tazeleniyor mu
        run: bash infra/scripts/linux/tests/test-update-frontend-tazele.sh "$PWD"
      # Root ajanlarin symlink sertlestirmesi (denetim A11/A13). Bu testler
      # `O_NOFOLLOW` gerektirir, yani Windows gelistirici makinesinde ATLANIR;
      # gercek dogrulama YALNIZCA burada olur. Ajanlar zaten Linux appliance
      # uzerinde calisiyor.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Appliance ajanlari — symlink sertlestirmesi
        run: |
          python -m pip install --upgrade pip -q
          pip install -q pytest
          pytest -q infra/appliance/tests

  nginx:
    # nginx yapilandirmasi GERCEK nginx ile sinaniyor.
    #
    # NEDEN AYRI JOB: bu dosyalardaki bir sozdizimi hatasi arayuzun TAMAMINI
    # dusurur (container baslamaz) ve gelistirici makinesinde dogrulamak icin
    # nginx kurulu olmasi gerekiyor — Windows'ta yok, Docker daemon her zaman
    # ayakta degil. Yani yerelde "gozle kontrol" disinda bir imkan yoktu.
    #
    # Ozellikle yedek yukleme yolu (client_max_body_size + buffering) bu
    # dosyalarda ayarlaniyor; zincirdeki en dusuk deger kazandigi icin sessizce
    # yanlis olmasi kolay.
    name: nginx yapilandirmasi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # frontend-web/nginx.conf bir conf.d PARCASIDIR (http baglaminda kosar),
      # tam bir config degil. Bu yuzden gercek imajin icine, gercek yerine
      # kopyalayip test ediyoruz.
      #
      # --add-host: `proxy_pass http://backend-api:8000` icin nginx isim
      # cozumlemesini KONFIG TESTINDE de yapar; CI'da o isim yok.
      - name: frontend-web nginx.conf
        run: |
          set -euo pipefail
          docker run --rm --add-host=backend-api:127.0.0.1 \
            -v "$PWD/apps/frontend-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/apps/frontend-web/security-headers.conf:/etc/nginx/security-headers.conf:ro" \
            nginx:1.27-alpine nginx -t
      - name: host-nginx configleri
        run: |
          set -euo pipefail
          for f in infra/host-nginx/*.conf; do
            echo "--- $f"
            docker run --rm \
              -v "$PWD/$f:/etc/nginx/conf.d/default.conf:ro" \
              nginx:1.27-alpine nginx -t
          done

  ap-firewall:
    # AP port filtresi GERCEK iptables ile sinaniyor.
    #
    # NEDEN AYRI JOB: bu kurallar yanlissa iki yonde de agir sonuc var —
    # ya SCADA/NATS portlari sifresiz WiFi'ye acik kalir, ya da AP'nin
    # KENDISI calismaz (DHCP/DNS kapanirsa istemci IP bile alamaz) ve AP
    # tam da kablolu ag bozulunca kullanilan KURTARMA YOLUDUR.
    #
    # Gelistirici makinesinde dogrulanamiyor: Windows'ta iptables yok, WSL
    # Ubuntu'da da kurulu degil. Yani tek gercek dogrulama yeri burasi.
    name: AP port filtresi — iptables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kurallar uygulaniyor ve dogrulaniyor
        run: |
          set -euo pipefail

          # DIS AGA BAGIMLI ADIM — yeniden dene.
          # Bu job iki kez altyapi yuzunden kirmizi oldu: bir kez Alpine
          # deposu ("temporary error"), bir kez Docker Hub
          # (registry-1.docker.io timeout). Ikisi de kodla ilgisiz. Kalici
          # kirmizi bir job zamanla "yine o job" diye gozardi edilmeye baslar
          # ve GERCEK bir kirilma da fark edilmez — asil risk budur.
          _dene() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge 3 ]; then
                echo "::error::3 denemede basarisiz: $*"
                return 1
              fi
              echo "Deneme $n basarisiz, $((n * 15)) sn sonra tekrar..."
              sleep $((n * 15))
            done
          }
          # Imaji ONCE cek: cekme hatasi ile KURAL hatasi birbirine karismasin.
          _dene docker pull -q alpine:3.20
          # Privileged container KENDI net namespace'inde calisir (varsayilan
          # bridge agi); icerideki iptables host'u ETKILEMEZ.
          #
          # `--network none` KULLANILMIYOR: paket kurulumu icin ag gerekiyor
          # (ilk denemede apk depoya ulasamayip job kirmiziya dondu). Izolasyon
          # zaten ayri namespace'ten geliyor.
          #
          # Test arayuzu olarak `eth0`: dummy arayuz yaratmak iproute2 + kernel
          # `dummy` modulu isterdi, ikisi de runner'da garanti degil. eth0
          # bridge agiyla her zaman var.
          docker run --rm --privileged \
            -v "$PWD/infra/appliance:/w:ro" -w /w \
            alpine:3.20 sh -eux -c '
              # apk de dis aga bagli — burada da yeniden dene.
              n=0
              until apk add --no-cache bash iptables >/dev/null 2>&1; do
                n=$((n + 1))
                [ "$n" -ge 3 ] && { echo "apk 3 denemede basarisiz"; exit 1; }
                sleep $((n * 10))
              done

              bash e1-ap-firewall.sh eth0 10.42.0.1

              echo "=== INPUT ==="; iptables -S INPUT
              echo "=== E1-AP-IN ==="; iptables -S E1-AP-IN
              echo "=== E1-AP-FWD ==="; iptables -S E1-AP-FWD
              echo "=== DOCKER-USER ==="; iptables -S DOCKER-USER

              # 1) Zincirler INPUT ve DOCKER-USER a bagli mi?
              iptables -S INPUT       | grep -q -- "-i eth0 -j E1-AP-IN"
              iptables -S DOCKER-USER | grep -q -- "-j E1-AP-FWD"

              # 2) Izin verilen portlar RETURN, geri kalan DROP.
              iptables -S E1-AP-IN | grep -q -- "--dport 80 -j RETURN"
              iptables -S E1-AP-IN | tail -1 | grep -q -- "-j DROP"
              iptables -S E1-AP-FWD | tail -1 | grep -q -- "-j DROP"

              # 3) AP CALISSIN: DHCP/DNS/mDNS/ICMP kapanmamali. Biri kapanirsa
              #    istemci IP alamaz ve kurtarma yolu yok olur.
              iptables -S E1-AP-IN | grep -q -- "--dport 67 -j RETURN"
              iptables -S E1-AP-IN | grep -q -- "--dport 53 -j RETURN"
              iptables -S E1-AP-IN | grep -q -- "--dport 5353 -j RETURN"
              iptables -S E1-AP-IN | grep -q -- "-p icmp -j RETURN"

              # 4) SCADA/mesajlasma portlari ACIKCA izinli OLMAMALI.
              for p in 502 2404 4222 5672 21; do
                if iptables -S E1-AP-IN | grep -q -- "--dport $p -j RETURN"; then
                  echo "HATA: $p portu AP istemcisine acik kalmis"; exit 1
                fi
              done

              # 5) IDEMPOTENT: ikinci kosuda kural yigilmamali.
              once=$(iptables -S INPUT | grep -c -- "-j E1-AP-IN")
              bash e1-ap-firewall.sh eth0 10.42.0.1
              sonra=$(iptables -S INPUT | grep -c -- "-j E1-AP-IN")
              [ "$once" = "$sonra" ] || { echo "HATA: kural yigildi ($once -> $sonra)"; exit 1; }

              # 6) Ozellestirme calisiyor mu (or. SSH gerekirse acilabilmeli).
              E1_AP_ALLOWED_TCP="80 443 22" bash e1-ap-firewall.sh eth0 10.42.0.1
              iptables -S E1-AP-IN | grep -q -- "--dport 22 -j RETURN"

              echo "AP PORT FILTRESI DOGRULANDI"
            '

  compose:
    name: docker-compose dogrulama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `compose config` YAML + interpolasyon + anchor'lari cozer. .env.example
      # ile kosuyoruz: zorunlu degiskenlerden biri (?: ile isaretli) orada
      # eksikse burada patlar, sahada degil.
      - name: compose config (.env.example ile)
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose config --quiet
          echo "Cozulen image referanslari:"
          docker compose config --images

  package:
    name: Debian paketi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lintian kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lintian
      # Paketi HER PR'da uretiyoruz: bozuk bir paket ancak yayin gunu fark
      # edilirse saha kurulumu durur. Burada ucuz, orada pahali.
      - name: Paketi uret
        run: bash packaging/build-deb.sh
      # build-deb.sh kaynak sizintisini kendi de kontrol ediyor; burada
      # BAGIMSIZ olarak tekrar bakiyoruz — paketin varlik sebebi bu.
      - name: Kaynak kod sizintisi kontrolu
        run: |
          set -euo pipefail
          deb="$(ls dist/*.deb)"
          echo "Paket: $deb"
          if dpkg-deb --contents "$deb" | grep -E '/(apps|node_modules|\.git)/'; then
            echo "::error::Pakete uygulama kaynagi sizmis."
            exit 1
          fi
          echo "Temiz: uygulama kaynagi pakette yok."
      - name: Kurulum provasi (temiz konteyner)
        run: |
          set -euo pipefail
          deb="$(ls dist/*.deb)"
          # Gercek bir Debian'da kurup kaldiriyoruz: postinst/prerm/postrm
          # hatalari ancak boyle yakalanir (sozdizimi kontrolu yetmez).
          # Paket yolu env ile geciyor — tirnak icinde string kaynastirmak
          # kolayca bozuluyor.
          docker run --rm -e DEB="/w/$deb" -v "$PWD:/w" -w /w debian:12-slim bash -eux -c '
            apt-get update -qq
            apt-get install -y -qq "$DEB"
            test -f /opt/enerjione-grid/docker-compose.yml
            test -x /usr/bin/enerjione-grid
            test -f /opt/enerjione-grid/.env
            # .env chmod 600 olmali: icinde secret var
            [ "$(stat -c %a /opt/enerjione-grid/.env)" = "600" ]
            # Uygulama kaynagi kurulmamis olmali
            ! test -d /opt/enerjione-grid/apps
            enerjione-grid help >/dev/null
            apt-get purge -y -qq enerjione-grid
            # purge sonrasi .env DURMALI (veri kaybi olmamali)
            test -f /opt/enerjione-grid/.env
            echo "KURULUM PROVASI TAMAM"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: enerjione-grid-deb
          path: dist/*.deb
          retention-days: 14

  version:
    name: Surum tutarliligi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # VERSION tek kaynak. package.json ondan sapmissa release tag'i hangi
      # surumu temsil ediyor belirsizlesir.
      - name: VERSION == package.json
        run: |
          set -euo pipefail
          v_file="$(tr -d ' \t\r\n' < VERSION)"
          v_pkg="$(node -p "require('./apps/frontend-web/package.json').version")"
          echo "VERSION=${v_file}  package.json=${v_pkg}"
          if [ "${v_file}" != "${v_pkg}" ]; then
            echo "::error::VERSION (${v_file}) ile package.json (${v_pkg}) uyusmuyor."
            exit 1
          fi
          if ! echo "${v_file}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION semver degil: ${v_file}"
            exit 1
          fi
