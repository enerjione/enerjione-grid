# CI — her PR ve main push'unda calisir.
#
# Amac: "main her an release edilebilir" garantisi. Release workflow'u bu
# kontrollerin gectigini varsayar; burada yakalanmayan hata sahaya gider.
#
# Isler bilerek AYRI job: biri kirildiginda digerlerinin sonucunu da gormek
# istiyoruz (tek job'da ilk hata kalanlari maskeler).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Ayni dal icin ust uste push atilirsa eskisini iptal et — runner israfi olmasin.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend-web/package-lock.json
      - name: Bagimliliklar (npm ci — lockfile birebir)
        working-directory: apps/frontend-web
        run: npm ci
      # `npm run build` = `tsc -b && vite build`. Ayri `tsc --noEmit` KOSMUYORUZ:
      # gecmiste --noEmit'in kacirdigi bir hatayi vite build yakalamisti, yani
      # asil kapi build. Typecheck zaten build'in ilk adimi.
      - name: Build (tsc -b + vite build)
        working-directory: apps/frontend-web
        run: npm run build

  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest
    # NATS servisi — WS fan-out koprusunun testleri GERCEK bir NATS ister.
    # Olmadan `tests/test_ws_fanout_bridge.py` skipif ile SESSIZCE atlaniyordu:
    # coklu surece gecisin tek koruyucu testi hicbir CI kosusunda kosmuyordu.
    # Bu, "test var" sanip korumasiz kalmanin klasik ornegi.
    services:
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend-api/requirements.txt
      - name: Bagimliliklar
        working-directory: apps/backend-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff (gercek hata kurallari)
        run: ruff check .
      - name: pytest
        working-directory: apps/backend-api
        run: pytest -q

  alarm-service:
    # Bu servisin CI'da HIC test kapsami yoktu; yalnizca backend-api
    # kosuluyordu. Denetim raporundaki A5 (ornek tamponu 512M container
    # limitini asip birkac saatte OOM-kill'e goturuyordu) tam da bu yuzden
    # kimsenin fark etmedigi bir davranisti. Kural motoru sahada alarm
    # uretmekten sorumlu; testsiz birakilacak son yer burasi.
    name: Alarm service — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/alarm-service/requirements.txt
      - name: Bagimliliklar
        working-directory: apps/alarm-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: pytest
        working-directory: apps/alarm-service
        run: pytest -q

  iec104-outbound:
    # SCADA cikisi. Testleri VARDI ama CI'da hic kosmuyordu — yani sozde
    # korumaliydi. Denetimdeki A7 (yari-acik oturumda k-penceresi kilitlenip
    # tum telemetrinin sessizce dusmesi) tam da kimsenin kosturmadigi bir
    # alanda duruyordu.
    name: IEC 104 outbound — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/iec104-outbound/requirements.txt
      - name: Bagimliliklar
        working-directory: apps/iec104-outbound
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: pytest
        working-directory: apps/iec104-outbound
        run: pytest -q

  modbus-outbound:
    # Modbus TCP yayini. Testleri VARDI ama CI'da kosmuyordu ve dahasi:
    # yardimci `check()` fonksiyonu ASSERT ETMIYORDU (yalnizca bir listeye
    # not dusuyordu), yani uc "test" icindeki kontrollerin hepsi patlasa
    # bile pytest'te yesil kaliyordu. Uctan uca TCP testi ise `async def`
    # oldugu ve pakette pytest-asyncio olmadigi icin HIC kosmuyordu.
    # Yani "4 test var" ciktisi tamamen aldaticiydi.
    name: Modbus outbound — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/modbus-outbound/requirements.txt
      - name: Bagimliliklar
        working-directory: apps/modbus-outbound
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: pytest
        working-directory: apps/modbus-outbound
        run: pytest -q

  migrations:
    name: Alembic — tek head kontrolu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Alembic kur
        run: pip install alembic
      # Iki dal ayni anda migration urettiginde zincir catallanir ve `upgrade
      # head` "Multiple head revisions" ile patlar — bunu MERGE ONCESI yakala.
      # `alembic heads` DB'ye baglanmaz, sadece versions/ dizinini okur.
      - name: Tek head mi?
        working-directory: apps/backend-api
        run: |
          set -euo pipefail
          heads="$(alembic heads 2>/dev/null | grep -c '(head)' || true)"
          echo "Bulunan head sayisi: ${heads}"
          alembic heads
          if [ "${heads}" != "1" ]; then
            echo "::error::Alembic zinciri catallanmis (${heads} head). 'alembic merge heads' ile birlestirin."
            exit 1
          fi

  scripts:
    name: Kurulum scriptleri — syntax + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Saha kurulumu bu scriptlere bagli; bir syntax hatasi mini PC'de
      # kurulumu yarida birakir. Once ucuz kontrol (bash -n), sonra shellcheck.
      - name: bash -n
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::bash syntax hatasi"; fail=1; }
          done < <(git ls-files '*.sh')
          exit $fail
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091: source edilen dosyayi CI'da cozemiyor (runtime'da var).
          # Ciddi bulgular (error) kapi; uyarilar rapor.
          git ls-files '*.sh' | xargs shellcheck -e SC1091 -S error
      # Sozdizimi dogru olan bir betik yanlis DAVRANABILIR. Guncelleme
      # yarida kalinca `.env` surumunun geri alinmasi (denetim A8) tam da
      # boyle bir sey: hatasiz calisir ama cihazi ilk reboot'ta oldururdu.
      - name: update.sh surum geri alma davranisi
        run: bash infra/scripts/linux/tests/test-update-version-rollback.sh "$PWD"
      # Update oncesi yedeklerin rotasyonu (denetim A12). Bu dosyalar hicbir
      # zaman silinmiyordu ve sahada diski dolduran kalemdi; rotasyon sessizce
      # kirilirsa ariza yalnizca aylar sonra, dolu bir diskte gorunur.
      - name: Pre-update yedek rotasyonu
        run: bash infra/scripts/linux/tests/test-pre-update-backup-rotation.sh "$PWD"
      # Root ajanlarin symlink sertlestirmesi (denetim A11/A13). Bu testler
      # `O_NOFOLLOW` gerektirir, yani Windows gelistirici makinesinde ATLANIR;
      # gercek dogrulama YALNIZCA burada olur. Ajanlar zaten Linux appliance
      # uzerinde calisiyor.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Appliance ajanlari — symlink sertlestirmesi
        run: |
          python -m pip install --upgrade pip -q
          pip install -q pytest
          pytest -q infra/appliance/tests

  compose:
    name: docker-compose dogrulama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `compose config` YAML + interpolasyon + anchor'lari cozer. .env.example
      # ile kosuyoruz: zorunlu degiskenlerden biri (?: ile isaretli) orada
      # eksikse burada patlar, sahada degil.
      - name: compose config (.env.example ile)
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose config --quiet
          echo "Cozulen image referanslari:"
          docker compose config --images

  package:
    name: Debian paketi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lintian kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lintian
      # Paketi HER PR'da uretiyoruz: bozuk bir paket ancak yayin gunu fark
      # edilirse saha kurulumu durur. Burada ucuz, orada pahali.
      - name: Paketi uret
        run: bash packaging/build-deb.sh
      # build-deb.sh kaynak sizintisini kendi de kontrol ediyor; burada
      # BAGIMSIZ olarak tekrar bakiyoruz — paketin varlik sebebi bu.
      - name: Kaynak kod sizintisi kontrolu
        run: |
          set -euo pipefail
          deb="$(ls dist/*.deb)"
          echo "Paket: $deb"
          if dpkg-deb --contents "$deb" | grep -E '/(apps|node_modules|\.git)/'; then
            echo "::error::Pakete uygulama kaynagi sizmis."
            exit 1
          fi
          echo "Temiz: uygulama kaynagi pakette yok."
      - name: Kurulum provasi (temiz konteyner)
        run: |
          set -euo pipefail
          deb="$(ls dist/*.deb)"
          # Gercek bir Debian'da kurup kaldiriyoruz: postinst/prerm/postrm
          # hatalari ancak boyle yakalanir (sozdizimi kontrolu yetmez).
          # Paket yolu env ile geciyor — tirnak icinde string kaynastirmak
          # kolayca bozuluyor.
          docker run --rm -e DEB="/w/$deb" -v "$PWD:/w" -w /w debian:12-slim bash -eux -c '
            apt-get update -qq
            apt-get install -y -qq "$DEB"
            test -f /opt/enerjione-grid/docker-compose.yml
            test -x /usr/bin/enerjione-grid
            test -f /opt/enerjione-grid/.env
            # .env chmod 600 olmali: icinde secret var
            [ "$(stat -c %a /opt/enerjione-grid/.env)" = "600" ]
            # Uygulama kaynagi kurulmamis olmali
            ! test -d /opt/enerjione-grid/apps
            enerjione-grid help >/dev/null
            apt-get purge -y -qq enerjione-grid
            # purge sonrasi .env DURMALI (veri kaybi olmamali)
            test -f /opt/enerjione-grid/.env
            echo "KURULUM PROVASI TAMAM"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: enerjione-grid-deb
          path: dist/*.deb
          retention-days: 14

  version:
    name: Surum tutarliligi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # VERSION tek kaynak. package.json ondan sapmissa release tag'i hangi
      # surumu temsil ediyor belirsizlesir.
      - name: VERSION == package.json
        run: |
          set -euo pipefail
          v_file="$(tr -d ' \t\r\n' < VERSION)"
          v_pkg="$(node -p "require('./apps/frontend-web/package.json').version")"
          echo "VERSION=${v_file}  package.json=${v_pkg}"
          if [ "${v_file}" != "${v_pkg}" ]; then
            echo "::error::VERSION (${v_file}) ile package.json (${v_pkg}) uyusmuyor."
            exit 1
          fi
          if ! echo "${v_file}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION semver degil: ${v_file}"
            exit 1
          fi
