# EnerjiOne Grid Dashboard — tek-komut Docker Compose dosyasi.
#
# Kurulum:
#   1. cp .env.example .env
#   2. .env'deki SECRET_KEY, INTERNAL_SERVICE_TOKEN, POSTGRES_PASSWORD,
#      RABBITMQ_PASSWORD degerlerini DEGISTIR (`openssl rand -hex 32`).
#   3. docker compose up -d --build
#   4. Browser: http://<vds-ip>/  (port 80)
#
# Ilk acilista backend-api `Base.metadata.create_all` ile semayi olusturur.
# Sonra installer hesabi olusturmak icin:
#   docker compose exec backend-api python scripts/create_installer.py \
#       --username admin --password 'StrongPassw0rd!' --full-name "Sistem Admin"
#
# (scripts/create_installer.py mevcutsa; degilse README'de manuel SQL adimi.)
#
# `name: enerjione-grid` — Compose proje adi (volume + network prefix'i icin).
# Repo dizin adi ne olursa olsun (EnerjiOneGrid, baska bir clone adi, ...)
# volume'lar `enerjione-grid_postgres-data`, network `enerjione-grid_e1-net`
# olarak olusur. Boylece marka tutarliligi disk artefaktlarinda da saglanmis
# olur ve ayni VPS'te EnerjiOne Solar (project name: enerjione-solar) ile
# yan yana durabilirler.
name: enerjione-grid

# Logging template: tum servisler default Docker json-file driver'i kullanir
# ama rotate ayari yok → disk dolar. Bu anchor her servise eklendiginde
# 10MB x 5 dosya cap koyar (toplam ~50MB / container). YAML anchor sayesinde
# tek yerden yonetilir; servisi tek tek update etmek gerekmez.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# NATS TLS sertifika dizini — NATS'a BAGLANAN her servise de baglanmali.
#
# NEDEN BURADA: `NATS_CA_FILE` istemci tarafinda okunur. Dizin yalnizca `nats`
# servisine baglandiginda, .env'e `NATS_CA_FILE=/etc/nats/certs/ca.crt` yazan
# operator (compose yorumlarinin ONERDIGI deger budur) istemci container'inda
# OLMAYAN bir yolu gostermis olur. TLS el sikismasi CA dogrulamasinda duser,
# `/health` NATS'i saglksiz gorur ve frontend-web `depends_on: service_healthy`
# yuzunden HIC BASLAMAZ — yani arayuz acilmaz. TLS kapaliyken dizin bos olsa
# bile bu mount zararsizdir (kimse okumaz).
x-nats-certs: &nats-certs
  - ./infra/nats/certs:/etc/nats/certs:ro

# Worker resource limits — alarm-service, tag-engine, notification-worker,
# iec104-outbound icin makul cap. Bir worker memory leak ederse host'u
# kilitlemez (OOM kill kendisini hedefler).
x-worker-resources: &worker-resources
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M
      reservations:
        memory: 128M

# Backend-api / postgres / nats / rabbitmq icin daha geniş cap.
x-heavy-resources: &heavy-resources
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 2G
      reservations:
        memory: 512M

# Postgres'e ayri ve daha genis bir tavan: telemetri yukunun tamami buradan
# geciyor ve shared_buffers + work_mem + maintenance_work_mem toplami 2G'ye
# sikisik kaliyordu (bkz. postgres servisindeki hesap).
#
# 3G -> 6G ARTISININ OLCUMU (100 cihaz / 176 sinyal, test sunucusu):
#   Postgres 3 GiB tavanin 2,33 GiB'ini kullaniyordu — yani %78 dolu ve
#   headroom yok. Ayni anda 6,1 GB'lik bir veri hacmi (outbox_events 1,7 GB,
#   processed_messages 1,0 GB, telemetry_history 0,94 GB) 768 MB'lik
#   shared_buffers ile taraniyordu; cache hit orani dusukse her sorgu diske
#   iniyor ve zaten dar olan I/O butcesini yiyor.
#
# NOT: 'limits' TAVAN, rezervasyon degil. Bos duran bellegi tutmaz. Olcum
# sirasinda host'ta 10 GiB BOS RAM duruyordu; tavani buyutmek bos bellegi
# rezerve etmez, sadece Postgres'in ihtiyaci oldugunda kullanmasina izin verir.
# Bu artisla tum servislerin TAVAN toplami 16 GB'lik saha donaniminin uzerine
# cikar; normalde sorun degil (tavanlar es zamanli dolmaz) ama es zamanli tepe
# yukte OOM killer devreye girebilir — gercek rezervasyon toplami ~3,8 GB.
#
# RAM 8 GB'in altindaki cihazlarda BURASI VE asagidaki postgres ayarlari
# (shared_buffers, effective_cache_size) BIRLIKTE dusurulmeli — yalnizca
# birini dusurmek ise yaramaz, cunku Postgres kendi tampon boyutunu cgroup
# tavanindan DEGIL postgresql.conf'tan okur.
#
# 2026-08-04 EK OLCUMU (400 cihaz): 6G tavanin yalnizca 1,85 GiB'i
# kullaniliyordu; tavan 4G'ye cekildi, bosalan pay NATS'a verildi (asagida).
x-postgres-resources: &postgres-resources
  deploy:
    resources:
      limits:
        cpus: "4.0"
        memory: 4G
      reservations:
        memory: 1536M

# 400-500 cihaz olcek butcesi (2026-08-04 yuk testi, host 15 GiB):
# postgres 4G + nats 3G + backend api 2G + worker 2G + tag-engine 2x768M +
# alarm 768M + gateway ~2G ~= 13 GiB, ~2 GiB pay kalir.
# CPU: asil kazanc worker'in 4 SURECLE calismasi (UVICORN_WORKERS) ve NATS'a
# 4 cekirdek (%121 olculdu). Tek asyncio surecine 3 cekirdek vermek ise
# yaramaz — tag-engine bunun yerine 2 REPLIKA ile olceklenir (queue-group).
x-backend-resources: &backend-resources
  deploy:
    resources:
      limits:
        cpus: "4.0"
        memory: 2G
      reservations:
        memory: 512M

x-nats-resources: &nats-resources
  deploy:
    resources:
      limits:
        cpus: "4.0"
        memory: 3G
      reservations:
        memory: 512M

x-tag-engine-resources: &tag-engine-resources
  deploy:
    resources:
      limits:
        cpus: "1.5"
        memory: 768M
      reservations:
        memory: 128M

x-alarm-resources: &alarm-resources
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 768M
      reservations:
        memory: 128M

# Container hardening — stateless worker'lar icin defense-in-depth.
# `no-new-privileges`: setuid binary'leri ile yetki yukseltme blok.
# `cap_drop: ALL`: Linux capability'leri (CAP_NET_BIND, CAP_SYS_ADMIN, ...) sifirla.
# Workers TCP socket bind etmiyor (sadece outbound), root yetki gerek yok.
# `read_only: true`: filesystem read-only; tmpfs /tmp gerekiyorsa caller ekler.
# Worker'lar (tag-engine, alarm-service, notification-worker, iec104-outbound)
# state'siz; gecici dosya ihtiyaclari icin tmpfs /tmp acilir.
x-hardened-worker: &hardened-worker
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,size=64m,mode=1777

services:
  postgres:
    # TimescaleDB (pg16 tabanli) — historian hypertable icin. Vanilla
    # postgres:16 volume'u ile uyumlu; extension migration 0007'de kurulur.
    image: timescale/timescaledb:2.17.2-pg16
    container_name: e1-grid-postgres
    restart: unless-stopped
    # shared_preload_libraries: TimescaleDB'nin hypertable/aggregate motoru
    # postgres process'ine on-yuklenmeli. Imaj bunu SADECE volume ilk kez
    # init edilirken otomatik yazar; mevcut (postgres:16'dan devralinan) dolu
    # volume'de bu ayar yok, o yuzden burada explicit veriyoruz. Aksi halde
    # `CREATE EXTENSION timescaledb` "could not access file" ile basarisiz olur.
    #
    # Bellek ayarlari — saha donanimi en az 16 GB RAM, container tavani 6 GB.
    # Varsayilanlarla (shared_buffers=128MB, work_mem=4MB) calisiliyordu; bu
    # telemetri yuku icin cok dusuk: 21M satirlik tabloda pencere/sort
    # islemleri 4 MB'a sigmayip DISKE tasiyordu.
    #
    # DIKKAT: cgroup tavanini (yukaridaki x-postgres-resources) buyutmek TEK
    # BASINA HICBIR SEY YAPMAZ — sadece OOM-kill'i geciktirir. Postgres kendi
    # tampon boyutunu postgresql.conf'tan okur; asagidaki degerler tavanla
    # BIRLIKTE buyutulmezse Postgres yine 768 MB tamponla calisir.
    #
    # Hesap (4 GB tavan icin — 2026-08-04: 6G'nin 1,85 GiB'i kullaniliyordu,
    # tavan 4G'ye cekildi, ayarlar BIRLIKTE indirildi):
    #   shared_buffers     1024M  ~ tavanin %25'i (PostgreSQL onerisi)
    #   work_mem             12M  Tavanla birlikte indirildi. Bu deger BAGLANTI BASINA DEGIL,
    #                             sorgudaki her sort/hash dugumu basinadir;
    #                             max_connections=300 x 12M = 3,6 G en kotu
    #                             durum. Buyutmek 4 G tavani tek bir sorgu
    #                             firtinasinda patlatir.
    #   maintenance_work_mem 512M  VACUUM / index olusturma. Autovacuum'un
    #                             outbox_events churn'une yetismesi icin
    #                             (bkz. asagidaki autovacuum ayarlari) 256M
    #                             dardi: her VACUUM turu olu tuple listesini
    #                             bellege sigdiramayip tabloyu birden cok kez
    #                             tariyordu.
    #   effective_cache_size  3G   PLANLAYICI IPUCU — bellek AYIRMAZ, sadece
    #                              "OS cache'inde ne kadar veri bulurum"
    #                              tahmini; index taramasini tercih ettirir
    #   1024M + 512M + tipik es zamanli sorgular = ~2-2,5 G  < 4G tavan
    #
    # RAM 8 GB'in altina inerse bu degerler ve yukaridaki limit DUSURULMELI.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
      # BAGLANTI TAVANI — belgelenen olcekleme recetesi varsayilani ASIYORDU.
      #
      # Hesap (docker-compose.yml'deki "NASIL ACILIR" bloguna gore):
      #   backend-api, E1_API_WORKERS=4 -> her uvicorn worker'i KENDI engine'ini
      #     kurar: 4 x (db_pool_size 30 + db_max_overflow 20) = 200
      #   backend-worker (scale profili, tek surec)            =  50
      #                                                    TOPLAM = 250
      #
      # PostgreSQL varsayilani 100. Yani receteyi uygulayan operator, yuk
      # arttiginda "remaining connection slots are reserved" hatalarina
      # giriyordu — ve bu tam da olceklemek icin yapilan degisiklikten SONRA
      # olacagi icin sebep-sonuc iliskisi yaniltici.
      #
      # 300: 250 + superuser rezervi + bakim/psql payi. Bagli olmayan bir slot
      # yalnizca birkac yuz KB tutar; asil bellek maliyeti CALISAN sorgu basina
      # `work_mem` (16MB) — tavani buyutmek onu degistirmez.
      #
      # `tests/test_connection_capacity.py` bu hesabi kaynaktan okuyup
      # dogruluyor: havuz boyutu ya da worker sayisi degisirse CI yakalar.
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=1024MB"
      - "-c"
      - "work_mem=12MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "effective_cache_size=3GB"
      # ---- WAL / checkpoint ----------------------------------------------
      # OLCUM: pg_wal dizini 2,0 GB — yani TAM `max_wal_size` kadar. Bu,
      # checkpoint'lerin ZAMAN degil BOYUT tetikledigi anlamina gelir.
      #
      # 2026-08-05 GUNCELLEME — YUKARIDAKI KARAR OLCUMLE CURUTULDU.
      # `pg_stat_bgwriter` 500 cihaz yukunde sunu gosterdi:
      #     zamanlanmis checkpoint :  34
      #     ZORLANMIS checkpoint   : 654   <- %95
      #     buffers_checkpoint     :  15.105.908
      #     buffers_backend        : 367.505.585   <- 24 KAT fazla
      # Yani WAL 2 GB tavanina o kadar hizli doluyor ki Postgres surekli ACIL
      # checkpoint yapiyor. Zorlanmis checkpoint YAYILAMAZ: bir anda buyuk bir
      # yazma dalgasi gelir ve o sirada gelen her INSERT bekler. Yazma hizi
      # 3.355 -> 1.666 satir/sn arasinda testere disi gibi dalgalaniyordu.
      # `buffers_backend`in 24 kat baskin olmasi ayni seyin ikinci kaniti:
      # kirli sayfalari checkpoint degil, VERI YAZAN SUREC diske indiriyor.
      #
      # Onceki gerekce "disk zaten doluyor" varsayimina dayaniyordu. O
      # varsayim artik gecerli DEGIL: arsiv 60/193 sinyale indirildikten
      # sonra disk %23-32'de ve 300+ GB bos. 16 GiB'lik WAL havuzu diskin
      # %4'u — dalgalanmayi ortadan kaldirmak icin ucuz bir bedel.
      #
      # wal_compression ZATEN acik ve dogru; WAL uretimini dusurmek hala
      # gecerli bir yol. Ikisi birlikte calisiyor:
      #
      #   wal_compression=on   Checkpoint sonrasi her sayfanin ilk
      #                        degisiminde tam sayfa imaji (FPI) WAL'a
      #                        yazilir; FPI'lar WAL hacminin buyuk kismidir.
      #                        Sikistirma bunlari kucultur -> 2 GB tavana
      #                        daha gec carpilir -> checkpoint seyrelir ->
      #                        daha az FPI. Pozitif geri besleme.
      #                        Maliyet: checkpoint sirasinda CPU (pglz). Bu
      #                        yuzden yukarida cpus 2 -> 4 yapildi.
      #                        `on` secildi, `lz4`/`zstd` DEGIL: bunlar imaj
      #                        derleme secenegine baglidir ve desteklenmiyorsa
      #                        Postgres HIC BASLAMAZ.
      #   checkpoint_timeout   15dk. Boyut tetiklemesi baskin oldugu surece
      #                        etkisizdir; wal_compression hacmi dusurup
      #                        tetiklemeyi zamana cevirdiginde devreye girer.
      #   min_wal_size         1GB. Varsayilan 80MB'de sunucu her checkpoint
      #                        sonrasi segment dosyalarini siliyor, ardindan
      #                        yeniden yaratiyordu; 1GB'lik havuz bu
      #                        yarat/sil churn'unu geri donusume cevirir.
      - "-c"
      - "max_wal_size=16GB"
      - "-c"
      # ---- DAYANIKLILIK TAKASI — VARSAYILAN GUVENLI TARAFTA ----------------
      # `synchronous_commit=off` her COMMIT'te WAL'in diske senkronize
      # olmasini BEKLEMEZ. Yazma hizini ciddi artirir, ama ANI GUC KESINTISI
      # ya da cekirdek cokmesinde son ~200 ms - 1 sn'lik commit'ler KAYBOLUR.
      #
      # NEDEN VARSAYILAN `on`
      # Bu bir ariza-gecis gostergesi izleme sistemi ve tuketici COMMIT
      # basarili donunce mesaji JetStream'de ACK'ler. `off` ile COMMIT, WAL
      # daha diske inmeden basarili doner; arada guc giderse mesaj HEM
      # ack'lenmis HEM yazilmamis olur — yani KALICI kayip, yeniden teslim
      # kurtarmaz. Saha cihazinda UPS garantisi yok.
      # 3.000 satir/sn'de bu pencere ~3.000 olcum eder ve icinde bir ariza
      # gecisi bulunabilir.
      #
      # Yuk testinde acmak icin: .env'e E1_PG_SYNC_COMMIT=off yazin.
      # Sahada acmadan once "bir gecisi kaybetmeyi goze aliyor muyuz"
      # sorusunun cevabi YAZILI olmali.
      - "synchronous_commit=${E1_PG_SYNC_COMMIT:-on}"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "checkpoint_timeout=15min"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_compression=on"
      # ---- Autovacuum ------------------------------------------------------
      # OLCUM: outbox_events 2,32M satir / 1,7 GB = satir basina ~730 bayt.
      # Satirin kendisi bunun cok altinda; aradaki fark OLU TUPLE (bloat).
      # En eski satir 36 dakikalik oldugu halde tablo 1,7 GB — yani silme
      # calisiyor ama autovacuum silinen tuple'lari geri kazanmaya
      # YETISEMIYOR. Varsayilan cost_limit=200 bu churn icin cok dusuk.
      #
      # naptime=10s: tur arasi bekleme 60sn -> 10sn. Bu tablolar dakikada
      # yuz binlerce satir dondurdugu icin 1 dakikalik uyku, tur baslarken
      # tablonun coktan yeniden sismis olmasi demek.
      - "-c"
      - "autovacuum_max_workers=5"
      - "-c"
      - "autovacuum_naptime=10s"
      - "-c"
      - "autovacuum_vacuum_cost_limit=2000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enerjione_grid}
      POSTGRES_USER: ${POSTGRES_USER:-enerjione_grid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env'de olmali}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enerjione_grid} -d ${POSTGRES_DB:-enerjione_grid}"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Ilk kurulumda initdb + TimescaleDB extension yaziliyor; saha mini
      # PC'sinin diski yavas oldugunda 20-30 sn surebilir. start_period
      # boyunca basarisiz denemeler retries'a sayilmaz.
      start_period: 40s
    networks:
      - e1-net
    logging: *default-logging
    <<: *postgres-resources

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: e1-grid-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hsl}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD .env'de olmali}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      # RabbitMQ ilk acilista Erlang VM + Mnesia veritabanini kuruyor; 2 cekirdekli
      # saha mini PC'sinde 60-90 sn surebiliyor. start_period olmadan bu sure
      # icindeki denemeler retries'a sayilip container 'unhealthy' isaretleniyor,
      # backend-api `depends_on: service_healthy` yuzunden hic baslamiyordu.
      start_period: 90s
    ports:
      # AMQP — uzaktaki gateway'lerin (saha kurulumlari, baska VDS, ofis vs.)
      # bagh kabilmesi icin internet'e acik. Guvenlik: dedicated user/parola
      # ve "loopback_users" disable degil; backend her gateway icin ayri user
      # uretiyor (gw-<code>). Default 'hsl' admin kullanicisi sadece backend
      # tarafindan kullanilir, parolasi .env'de.
      - "5672:5672"
      # Management UI host'a sadece localhost'tan acilir; genel internete kapali.
      # Tunelle gormek icin: ssh -L 15672:localhost:15672 user@vds
      - "127.0.0.1:15672:15672"
    networks:
      - e1-net
    logging: *default-logging
    <<: *heavy-resources

  # NATS JetStream — telemetri akisinin PRIMARY rotasi (gateway -> tag-engine
  # -> alarm/iec104). RabbitMQ alarm.created icin paralel calismaya devam eder.
  #
  # Auth: infra/nats/nats-server.conf'ta tanimli 3 user (gateway, backend,
  # worker) — her birinin sadece izinli subject'lere erisimi var. Compose env
  # uzerinden NATS_URL'ler `nats://user:pass@nats:4222` format'inda.
  #
  # 4222 portu host'a expose ediliyor (uzak gateway'ler bagklanabilsin diye).
  # Auth zorunlu; default permissions deny-all. TLS sonraki tur'a.
  nats:
    image: nats:2.10-alpine
    container_name: e1-grid-nats
    restart: unless-stopped
    command:
      - "-c"
      - "/etc/nats/nats-server.conf"
    volumes:
      - ./infra/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      # TLS sertifikalari. Dizin TLS kapaliyken BOS olur ve mount zararsizdir;
      # kosullu mount yazmak compose'da mumkun degil, bos dizin ise NATS'i
      # etkilemez (config'te tls blogu yoksa hic okunmaz).
      # DIKKAT: CA'nin OZEL anahtari (ca.key) da bu dizinde duruyor ama
      # container'in ona ihtiyaci yok; read-only mount ile en azindan
      # degistirilemez. Uretim betigi ca.key'i 0600 birakir.
      - ./infra/nats/certs:/etc/nats/certs:ro
      - nats-data:/data
    healthcheck:
      # Auth aktif olunca /healthz auth-suz erisilebilir (NATS default).
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      # NATS client port — uzaktaki gateway'ler (leaf node veya dogrudan)
      # `nats://gateway:<password>@<host>:4222` ile baglanir.
      - "4222:4222"
      # HTTP monitoring (varz/connz/jsz) — sadece localhost'tan.
      - "127.0.0.1:8222:8222"
    networks:
      - e1-net
    logging: *default-logging
    <<: *nats-resources

  backend-api:
    build:
      context: ./apps/backend-api
      dockerfile: Dockerfile
    image: ${E1_REGISTRY:-ghcr.io/enerjione/enerjione-grid}/backend-api:${E1_VERSION:-latest}
    container_name: e1-grid-backend-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        # `service_started` — `service_healthy` DEGIL. Gerekcesi acilis suresi:
        # RabbitMQ'nun healthcheck'i `start_period: 90s` (Erlang VM + Mnesia,
        # 2 cekirdekli saha mini PC'sinde gercekten bu kadar suruyor) ve
        # backend bunu SERI olarak bekliyordu. Oysa backend RabbitMQ olmadan
        # da ayaga kalkar: kendi yayinlari zaten yeniden deneme dongusunde ve
        # /health rabbitmq'yu `degraded` sayar (kritik degil). Bu tek satir
        # acilistan ~90 saniye kesiyor ve hicbir garantiyi zayiflatmiyor.
        condition: service_started
      nats:
        # Ayni gerekce. Backend startup'ta stream'leri ensure eder; NATS o an
        # yoksa jetstream_bus yeniden deneme dongusune girer (A6 duzeltmesi)
        # ve NATS gelir gelmez baglanir. `service_healthy` beklemek acilisi
        # uzatmaktan baska bir sey yapmiyordu.
        condition: service_started
    environment:
      APP_ENV: production
      # --- Olcekleme ---
      # Surec rolu. VARSAYILAN `api` = arka plan isleri BU SURECTE KOSMAZ;
      # asagidaki `backend-worker` container'inda kosar.
      #
      # NEDEN VARSAYILAN DEGISTI (2026-08-04, olculdu)
      # ----------------------------------------------
      # Ayirma yetenegi v2.29.0'da eklendi ama `scale` profiline ve elle
      # yazilacak uc `.env` satirina bagliydi. Sahada kimse yazmadi:
      # `docker compose config --services` varsayilan ortamda backend-worker'i
      # HIC listelemiyordu ve `SERVICE_ROLE` `all` olarak render ediliyordu.
      # Yani 12 arka plan isi (telemetri tuketicisi, outbox yayini, retention,
      # historian, yedekleme...) HTTP ile AYNI Python surecinde, AYNI GIL
      # altinda kosmaya devam etti; olcumde backend-api %105 CPU'da
      # (= tek cekirdek dolu) iken cgroup tavani 2.0 CPU idi — ayrilan
      # islemcinin yarisi tek surec oldugu icin KULLANILAMIYORDU.
      #
      # `all` ile geri donulur: `.env`e `E1_BACKEND_ROLE=all` yazip
      # backend-worker'i durdurmak eski tek-container davranisini verir.
      #
      # Yanlis ayarlansa bile isler IKI KEZ KOSMAZ — lider secimi Postgres
      # advisory lock ile yapilir (app/core/service_role.py). `api` rolunde
      # ise bu surec kilidi HIC TALEP ETMEZ (wants_background() False), yani
      # tek yayinci garantisi yarisa bile girmeden saglanir.
      SERVICE_ROLE: ${E1_BACKEND_ROLE:-api}
      # Arka plan surecinin ic adresi — YALNIZCA rol `api` iken okunur.
      # Telemetri boru hatti olcumu (backlog, mesaj/sn) surec-ici sayaclardan
      # gelir; ayirdiktan sonra API bu adrese sorar, yoksa Sistem Durumu
      # sayfasi kalici sahte "critical" gosterirdi.
      # `backend-worker` bu env'i `extends` ile devralir ama HIC kullanmaz
      # (kendi sayaclari zaten yerelde).
      BACKEND_WORKER_HOST: ${E1_BACKEND_WORKER_HOST:-backend-worker}
      # Uvicorn worker sayisi. 1 = varsayilan. Coklu worker artik GUVENLI
      # (arka plan isleri tek surecte, WS yayini NATS uzerinden) ama her
      # worker ayri bir Python sureci + DB pool'u demek; saha cihazinin
      # bellegine gore ayarlanmali. Olcum: 40 es zamanli WS abonesi tek
      # cekirdegin ~%104'unu kullaniyor.
      UVICORN_WORKERS: ${E1_API_WORKERS:-1}
      # Calisan surum — Lisans ve Sistem Durumu sayfalari bunu gosterir.
      # Ayni degisken imaj etiketi olarak da kullaniliyor; 'latest' gibi
      # semver olmayan bir deger gelirse config.py imajla paketlenen
      # surume duser (arayuzde "latest" yazmasin diye).
      E1_VERSION: ${E1_VERSION:-latest}
      # Guncelleme kontrolu SADECE BILGI amaclidir; arayuzden guncelleme
      # baslatilamaz. Bos ise kontrol tamamen kapalidir.
      UPDATE_CHECK_URL: ${UPDATE_CHECK_URL:-}
      UPDATE_CHECK_INTERVAL_SEC: ${UPDATE_CHECK_INTERVAL_SEC:-21600}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY .env'de olmali}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-enerjione_grid}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-enerjione_grid}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Vhost izolasyonu: kok `/` vhost'a degil dedicated `e1` (veya
      # `${RABBITMQ_VHOST}`) altinda calisilir. Backend startup'ta admin
      # API uzerinden idempotent ensure eder.
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-hsl}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-e1}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-e1}
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_ADMIN_USERNAME: ${RABBITMQ_USER:-hsl}
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_PASSWORD}
      # NATS JetStream — telemetri akisinin PRIMARY rotasi. Backend startup'ta
      # stream'leri otomatik ensure eder (TELEMETRY_RAW, TELEMETRY_NORMALIZED).
      # NATS server'da 3 user var (gateway/backend/worker); backend admin tam yetki.
      NATS_URL: ${NATS_URL_BACKEND:-${NATS_URL:-nats://nats:4222}}
      # NATS HTTP monitor (jsz) — Sistem Durumu'ndaki asama kuyruklari buradan
      # okunur. Ulasilamazsa panel asamasiz calisir (fail-soft).
      NATS_MONITOR_URL: ${NATS_MONITOR_URL:-http://nats:8222}
      # TLS CA dosyasi. BOS = TLS kapali (varsayilan, bugunku davranis).
      # Doluysa baglanti YALNIZCA bu CA'ya guvenir; isletim sisteminin
      # guven deposu kullanilmaz. Acmak icin once sertifika uretin:
      #   sudo bash infra/scripts/linux/nats-tls-setup.sh
      # sonra .env'e NATS_TLS_ENABLED=true + NATS_CA_FILE=/etc/nats/certs/ca.crt
      # ve NATS_URL'i tls:// semasina cevirin.
      NATS_CA_FILE: ${NATS_CA_FILE:-}
      # Gateway sifresi backend'in iki yerde lazim:
      # 1) production guard (config.py _validate_production_safeguards) bos
      #    olmasini reddeder
      # 2) `derive_nats_url(backend_url, gateway_password=...)` frontend
      #    "gateway compose dosyasi indir" akisinda saha gateway'ine giden
      #    NATS_URL'i bu sifre ile gomer. Bos ise saha gateway'i NATS'a
      #    anonim baglanir, deny-all ile reddedilir, telemetri akmaz.
      NATS_GATEWAY_PASSWORD: ${NATS_GATEWAY_PASSWORD:?NATS_GATEWAY_PASSWORD .env'de olmali}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN .env'de olmali}
      # Oturum omru (dakika). Varsayilan config.py ile AYNI: 1440 = 24 saat.
      # Buradaki default 43200 (30 gun) idi; "beni hatirla" isaretlenmemis
      # kullanicilara da 30 gunluk token veriyor ve backend'deki ayri
      # REMEMBER_ME_TOKEN_MINUTES akisini islevsiz birakiyordu.
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-1440}
      # "Beni hatirla" TTL'i (dakika). Yalnizca kutucuk isaretlenirse gecerli.
      REMEMBER_ME_TOKEN_MINUTES: ${REMEMBER_ME_TOKEN_MINUTES:-43200}
      # --- Retention / TTL: "disk asla dolmamali" -------------------------
      # Tum degerlerin tek kaynagi app/core/config.py; buradaki default'lar
      # onunla AYNI olmak zorunda (tests/test_config_consistency.py kilitler).
      #
      # telemetry: canli deger tablosu. Her sinyalin SON degeri retention'dan
      # muaftir, yani sure kisa olsa da canli ekran bosalmaz.
      TELEMETRY_RETENTION_MINUTES: ${TELEMETRY_RETENTION_MINUTES:-30}
      TELEMETRY_RETENTION_INTERVAL_SEC: ${TELEMETRY_RETENTION_INTERVAL_SEC:-300}
      # processed_messages: idempotency defteri. Gercek redelivery penceresi
      # ack_wait(60s) x max_deliver(10) = 10 DAKIKA; 24 saat 144 kat marj.
      # (Onceki 7 GUNluk deger tabloyu ~180M satira cikariyordu.)
      PROCESSED_MESSAGES_RETENTION_HOURS: ${PROCESSED_MESSAGES_RETENTION_HOURS:-2}
      PROCESSED_MESSAGES_INTERVAL_SEC: ${PROCESSED_MESSAGES_INTERVAL_SEC:-60}
      # system_events: denetim/olay kaydi. 2 yil (730 gun) + FIFO adet tavani.
      # Tavan, olay firtinasinda 2 yil dolmadan da devreye giren emniyet subabi.
      SYSTEM_EVENTS_RETENTION_DAYS: ${SYSTEM_EVENTS_RETENTION_DAYS:-730}
      SYSTEM_EVENTS_INTERVAL_SEC: ${SYSTEM_EVENTS_INTERVAL_SEC:-21600}
      SYSTEM_EVENTS_MAX_ROWS: ${SYSTEM_EVENTS_MAX_ROWS:-5000000}
      # Retention DELETE'leri LIMIT'li turlar halinde kosar (WAL sismesin,
      # tablo uzun sure kilitlenmesin, autovacuum arayi yakalasin).
      RETENTION_DELETE_BATCH: ${RETENTION_DELETE_BATCH:-20000}
      RETENTION_MAX_BATCHES_PER_RUN: ${RETENTION_MAX_BATCHES_PER_RUN:-50}
      # --- Gateway izleme -------------------------------------------------
      # BU SATIRLAR SART: bu ayarlar kodda `os.getenv` ile okunuyor, compose
      # gecirmezse operator DEGISTIREMEZ — ayar var gibi gorunur ama yoktur.
      # (Ayni sinif daha once BACKUP_OFFSITE_DIR, ACCESS_TOKEN_MINUTES,
      # OUTBOX_* ve NATS_STREAM_*_MAX_AGE_DAYS'te gorulda.)
      #
      # Gateway susarsa cihazlar yesil kalmasin: tarama periyodu ve gateway'in
      # "bayat" sayilma esigi.
      GATEWAY_STALE_CHECK_INTERVAL_SEC: ${GATEWAY_STALE_CHECK_INTERVAL_SEC:-60}
      GATEWAY_STALE_AFTER_SEC: ${GATEWAY_STALE_AFTER_SEC:-180}
      # Gateway imaji icin yeni surum kontrolu (ajanin uzak digest onbellegi
      # 15 dakika; daha sik sormanin karsiligi yok).
      GATEWAY_UPDATE_CHECK_INTERVAL_SEC: ${GATEWAY_UPDATE_CHECK_INTERVAL_SEC:-900}
      # Filo seviyesi kopma uyarisi: cihazlarin bu orandan FAZLASI bu sure
      # boyunca kesintisiz kopuksa muhendis/kurulumcu uyarilir. Oran tek tek
      # cihaz kopmalarini elemek, sure ise gateway yeniden baslatmalarinda
      # yanlis alarm uretmemek icin.
      GATEWAY_FLEET_LOST_RATIO: ${GATEWAY_FLEET_LOST_RATIO:-0.5}
      GATEWAY_FLEET_SUSTAIN_SEC: ${GATEWAY_FLEET_SUSTAIN_SEC:-300}
      # Disk guard — SON EMNIYET SUBABI. Yukaridaki TTL'ler ve asagidaki
      # NATS/yedek tavanlari "normalde dolmaz" der; guard "tavanlardan biri
      # yanlis hesaplanmis olsa BILE dolmasin" der ve gercek bos alani olcer.
      # rezerv = max(toplam x YUZDE, MIN_GB). Yuzde tabanli olmasi 128 GB'lik
      # ve 500 GB'lik kutularda tek kod yolunu dogru kilar.
      DISK_GUARD_ENABLED: ${DISK_GUARD_ENABLED:-true}
      DISK_GUARD_RESERVE_PERCENT: ${DISK_GUARD_RESERVE_PERCENT:-10}
      DISK_GUARD_RESERVE_MIN_GB: ${DISK_GUARD_RESERVE_MIN_GB:-5}
      DISK_GUARD_INTERVAL_SEC: ${DISK_GUARD_INTERVAL_SEC:-300}
      DISK_GUARD_EMERGENCY_BACKUP_KEEP: ${DISK_GUARD_EMERGENCY_BACKUP_KEEP:-2}
      # Bos ise BACKUP_DIR olculur (gercek volume mount'u; container'in `/`
      # overlay'i yaniltici olabilir).
      DISK_GUARD_PATH: ${DISK_GUARD_PATH:-}
      # Canli deger yayini (WebSocket fan-out). Coklu surece gecisin ON
      # KOSULU: kopru olmadan tuketici ayri container'a alininca WS
      # istemcilerine hicbir sey ulasmaz ve ariza SESSIZ olur.
      # false = acil kill switch (yayin bellek-ici yola duser).
      WS_FANOUT_NATS_ENABLED: ${WS_FANOUT_NATS_ENABLED:-true}
      WS_FANOUT_SUBJECT: ${WS_FANOUT_SUBJECT:-e1.ws.telemetry}
      # NATS JetStream stream basina DISK tavani (bayt). max_age tek basina
      # bayt siniri vermez; bu tavanlar + discard=old sayesinde tampon dolunca
      # en eski mesajlar duser ve telemetri akisi DURMAZ. Toplam 10 GiB;
      # infra/nats/nats-server.conf max_file_store bunun ustunde kalmali.
      #
      # DUSURMEDEN ONCE config.py'deki gerekceyi okuyun: budama tuketicinin
      # nerede oldugunu UMURSAMAZ, tavan = tuketicinin geri kalabilecegi
      # mesafedir. Olculen depodan (5,6 GB) kucuk bir tavan, henuz ISLENMEMIS
      # telemetriyi ilk yeniden baslatmada siler.
      NATS_STREAM_RAW_MAX_BYTES: ${NATS_STREAM_RAW_MAX_BYTES:-25769803776}
      NATS_STREAM_NORMALIZED_MAX_BYTES: ${NATS_STREAM_NORMALIZED_MAX_BYTES:-12884901888}
      NATS_STREAM_DLQ_MAX_BYTES: ${NATS_STREAM_DLQ_MAX_BYTES:-2147483648}
      # Stream YAS siniri (gun). BU SATIRLAR EKSIKTI: config.py'de tanimliydi
      # ama compose gecirmedigi icin hic ayarlanamiyordu — 29 GB'lik bir
      # cihazda 12 GiB tavan + 7/30 gunluk yas siniriyle JetStream deposu
      # 5,9 GB'a cikti ve diski dolduran en buyuk kalem oldu.
      #
      # Bos degil KONKRE varsayilan geciliyor: bu ayarlar pydantic `int`,
      # bos string dogrulamada patlar ve backend HIC baslamaz.
      #
      # Yas sinirlari YUKLU sahada hic ISLEMEZ (bayt tavani saatler icinde
      # zaten carpar); asil isleri KUCUK sahada, stream'in ack'lenmis
      # mesajlari arsivlemesini engellemektir. Kalicilik telemetry_history'de.
      NATS_STREAM_RAW_MAX_AGE_DAYS: ${NATS_STREAM_RAW_MAX_AGE_DAYS:-2}
      NATS_STREAM_NORMALIZED_MAX_AGE_DAYS: ${NATS_STREAM_NORMALIZED_MAX_AGE_DAYS:-7}
      NATS_STREAM_DLQ_MAX_AGE_DAYS: ${NATS_STREAM_DLQ_MAX_AGE_DAYS:-30}
      # --- Kalicilastirma kaynagi: RAW -> NORMALIZED gecisi ---------------
      # Kalicilastirma artik tag-engine CIKISINDAN beslenir; boylece arsiv,
      # alarm-service, iec104-outbound ve modbus-outbound AYNI normalize
      # edilmis degeri gorur. `auto` once eski RAW durable'ini BOSALTIR
      # (birikmis olcumler kaybolmasin), bosalinca kendiliginden gecer —
      # operator adimi YOKTUR. Elle mudahale gerekirse:
      #   raw        -> gecisi ertele (eski davranis)
      #   normalized -> drenaji atla (YALNIZCA temiz kurulum)
      TELEMETRY_PERSIST_SOURCE: ${TELEMETRY_PERSIST_SOURCE:-auto}
      # Gecis aninda NORMALIZED akisinda geri sarilan pencere (saniye).
      # Tag-engine'in kendi gecikmesi kadarlik boslugu kapatir. Tekrar gelen
      # olcumleri `processed_messages` defteri eler, bu yuzden deger o
      # defterin omrunu (PROCESSED_MESSAGES_RETENTION_HOURS) ASAMAZ — kod
      # tavani zorlar ve asilirsa kirpip loglar.
      TELEMETRY_PERSIST_CUTOVER_OVERLAP_SEC: ${TELEMETRY_PERSIST_CUTOVER_OVERLAP_SEC:-900}
      # --- IKI HAT: oncelikli (dijital/durum) ve toplu (analog) -----------
      # Kalicilastirma her sinifi KENDI durable'i ile ceker; toplu hattaki
      # analog birikimi oncelikli hattin ONUNE GECEMEZ. Konu son token'ini
      # tag-engine katalogdan cikarir (bkz. tag_engine/katalog.py).
      # false -> tek hat (eski davranis). Iki hat once BOSALTILIR, sonra
      # tek hatta donulur; olcum kaybolmaz.
      TELEMETRY_PERSIST_SPLIT_ENABLED: ${TELEMETRY_PERSIST_SPLIT_ENABLED:-true}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@enerjione-grid.local}
      # WhatsApp Web sidecar (Baileys, QR ile giris) — ayni Docker network
      # icinde servis adiyla erisilir, INTERNAL_SERVICE_TOKEN ile auth.
      WHATSAPP_WEB_GATEWAY_URL: http://whatsapp-web-gateway:8016
      # DB yedek dosyalari icin sabit dizin. backup-data volume'una baglanir
      # ki container yeniden olusturulsa da yedekler kaybolmaz.
      BACKUP_DIR: /var/lib/e1-backups
      # Off-site (ikinci disk / NAS) yedek kopyasi.
      #
      # BU SATIR SART: compose'da `env_file` YOK. Degisken burada
      # listelenmedigi icin backup_service'in `os.getenv("BACKUP_OFFSITE_DIR")`
      # cagrisi container'da HER ZAMAN bos donuyordu; `.env`'ine NAS yolunu
      # yazan operator icin bile `_offsite_copy` ilk satirda `return` ediyor,
      # ne hata ne uyari uretiyordu. Yani ozellik tamamen OLUYDU ve bu ancak
      # felaket aninda — tek kopya da gittiginde — fark edilirdi.
      #
      # `.env`'deki BACKUP_OFFSITE_DIR bir HOST yoludur; container icinde her
      # zaman sabit /var/lib/e1-backups-offsite olarak gorunur (asagidaki
      # mount). `:+` sayesinde degisken bos/tanimsizsa bu env de BOS kalir ve
      # _offsite_copy hicbir sey yapmaz — yani ozellik tek degiskenle acilip
      # kapanir.
      BACKUP_OFFSITE_DIR: ${BACKUP_OFFSITE_DIR:+/var/lib/e1-backups-offsite}
      # FCM push bildirim icin Firebase service account JSON yolu.
      # Host'ta /opt/enerjione-grid/fcm-service-account.json varsa volume mount edilir.
      # Dosya yoksa FCM sessizce devre disi kalir (fcm.py lazy load), email/SMS
      # kanallari calismaya devam eder.
      FCM_SERVICE_ACCOUNT_PATH: /app/fcm-service-account.json
      # Offline cihaz lisansi: dosya kalici volume'da; makine bagi host'un sabit
      # OS machine-id'sinden gelir. USB/disk/MAC/container ID kullanilmaz.
      LICENSE_DIR: /var/lib/e1-license
      HOST_MACHINE_ID_PATH: /run/host-machine-id
      # Appliance (mini PC) modu: host ag ajani e1-netd ile paylasilan dizin.
      # Backend buraya ag ayari istegi yazar; ajan (root) dogrulayip uygular.
      NETWORK_STATE_DIR: /var/lib/e1-grid/net
      # Gateway kurulum ajani (e1-gwd) ile paylasilan dizin. Backend buraya
      # "gateway'i bu cihaza kur" istegi yazar; ajan (root) compose'u calistirir.
      GATEWAY_STATE_DIR: /var/lib/e1-grid/gw
      # Uzaktan bakim izni ajani (e1-rad) ile paylasilan dizin. Backend buraya
      # "izni ac/kapat" istegi yazar; sureyi ve tailscale komutlarini host'taki
      # ajan (root) yurutur. Uzaktan erisim VARSAYILAN KAPALIDIR.
      REMOTE_ACCESS_STATE_DIR: /var/lib/e1-grid/remote
      # Site tavani: bir iznin en fazla kac dakika surebilecegi. Varsayilan
      # 1440 (24 saat). Musteri daha kisa bir ust sinir isterse .env'e
      # REMOTE_ACCESS_MAX_MINUTES=... yazar.
      #
      # BU SATIR SART: compose'da `env_file` YOK, yalnizca burada listelenen
      # degiskenler container'a geciyor. Satir olmadan ayar config.py'de
      # tanimli olmasina ragmen .env'den okunmuyordu ve tavan sessizce hep
      # 1440 kaliyordu (olu ayar).
      REMOTE_ACCESS_MAX_MINUTES: ${REMOTE_ACCESS_MAX_MINUTES:-1440}

      # --- Outbox ayarlari -------------------------------------------------
      # AYNI TUZAK UCUNCU KEZ: bu bes degisken `outbox_flush_worker` docstring'inde
      # "Konfigurasyon (env)" diye BELGELENMISTI ama compose'da listelenmedigi
      # icin container'a HIC ULASMIYORDU. Operator .env'e yazar, hicbir sey
      # degismezdi. (Ayni sey daha once BACKUP_OFFSITE_DIR ve
      # ACCESS_TOKEN_MINUTES'ta yasandi; yukaridaki notlara bakin.)
      #
      # FLUSH ayarlari `os.getenv(..., "N")` + try/except ile okunuyor; bos
      # deger kod varsayilanina duser, o yuzden varsayilan BILEREK bos.
      OUTBOX_FLUSH_INTERVAL_SEC: ${OUTBOX_FLUSH_INTERVAL_SEC:-}
      OUTBOX_FLUSH_BATCH: ${OUTBOX_FLUSH_BATCH:-}
      # SAKLAMA/TEMIZLIK ayarlari 2026-08-03'te `settings`e (pydantic int)
      # tasindi. BOS DEGER ARTIK GECILEMEZ: pydantic dogrulamasi patlar ve
      # backend HIC baslamaz. Bu yuzden gercek varsayilanlar burada; config.py
      # ile senkronu tests/test_config_consistency.py kilitler.
      OUTBOX_PUBLISHED_RETENTION_MINUTES: ${OUTBOX_PUBLISHED_RETENTION_MINUTES:-15}
      OUTBOX_PURGE_INTERVAL_SEC: ${OUTBOX_PURGE_INTERVAL_SEC:-60}
      OUTBOX_DEAD_LETTER_RETAIN_DAYS: ${OUTBOX_DEAD_LETTER_RETAIN_DAYS:-14}
      OUTBOX_MAX_PUBLISH_ATTEMPTS: ${OUTBOX_MAX_PUBLISH_ATTEMPTS:-5}
      # ARTIK OKUNMUYOR, bilerek geciriliyor: sahada .env'ine bunlari yazmis
      # kurulum ayari degistirdigini SANMASIN diye backend acilista uyari
      # logluyor (telemetry_retention._warn_legacy_env).
      OUTBOX_PUBLISHED_RETENTION_HOURS: ${OUTBOX_PUBLISHED_RETENTION_HOURS:-}
      OUTBOX_PURGE_BATCH: ${OUTBOX_PURGE_BATCH:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    # NOT: 8000 host'a EXPOSE EDILMEZ. Browser ve uzak gateway'ler trafigini
    # nginx (frontend-web) uzerinden 80/443'e atar; nginx `/api/*` istegini
    # backend-api:8000'e (compose internal network) proxy eder. Bu sayede:
    #   - Tek public attack surface (nginx),
    #   - HTTPS terminator (Caddy/Traefik) ekleyince herkes ayni yolda,
    #   - 8000 brute-force/recon'a kapali.
    # Gateway'ler `BACKEND_API_URL=https://<vds-domain>/api/v1` ile baglanir.
    # Yerel dev'de host'tan 8000'e dogrudan erismek isteyenler nginx'in 80'i
    # uzerinden ulasabilir; veya `docker compose exec backend-api curl ...`.
    volumes:
      - backup-data:/var/lib/e1-backups
      # Off-site yedek hedefi. Env'i eklemek TEK BASINA yetmez — host'taki
      # NAS/ikinci disk yolu container'a baglanmazsa kopyalama "dizin yok"
      # ile duser.
      #
      # Degisken bos/tanimsizsa proje icindeki ./backups baglanir. Bu YALNIZCA
      # compose'un gecerli kalmasi icin; yukaridaki env `:+` ile bos oldugu
      # icin backend bu yola HICBIR SEY yazmaz. (Etkisiz bir yer tutucu olarak
      # `/dev/null` daha zarif gorunuyordu ama bir aygit dosyasini bind
      # etmenin calistigini bu makinede DOGRULAYAMADIM; yanlissa off-site
      # kapali olan HER kurulumda backend ayaga kalkmazdi. Sirasi gelmisken
      # alinacak risk degil — dizin bind'i sirandan ve kesin.)
      #
      # DIKKAT: hedef bir ag paylasimi ise container BASLAMADAN ONCE host'ta
      # mount edilmis olmali. Aksi halde Docker bind mount icin bos bir dizin
      # yaratir ve yedekler YEREL diske yazilir — off-site sanilan kopya ayni
      # diskte kalir. Ayrica dizin uid 10001 (backend) tarafindan yazilabilir
      # olmali.
      - ${BACKUP_OFFSITE_DIR:-./backups}:/var/lib/e1-backups-offsite
      # NATS TLS CA'si — bkz. x-nats-certs anchor'i. Anchor bir LISTE oldugu
      # icin buraya merge edilemez; ayni yol elle tekrarlanir. Degistirirken
      # anchor ile birlikte degistirin (test_config_consistency bunu kilitler).
      - ./infra/nats/certs:/etc/nats/certs:ro
      - license-data:/var/lib/e1-license
      # Host OS kimligi sabit; USB/disk/RAM/ag karti degisimi bunu etkilemez.
      # Container recreate sonrasi lisans ayni makinede gecerli kalir.
      - /etc/machine-id:/run/host-machine-id:ro
      # FCM service account — host'ta dosya yoksa Docker DIZIN olarak yaratir
      # (bind mount kazasi). Bunu onlemek icin :ro flag + dosya zorunluluk.
      # Dosya yoksa kullanici install/update sirasinda uyarilir; FCM o zaman
      # devre disi kalir ama backend ayaga kalkmaya devam eder.
      - ./fcm-service-account.json:/app/fcm-service-account.json:ro
      # Appliance modu: host ag ajani (e1-netd) ile tek temas noktasi.
      # Backend'in host agina baska hicbir erisimi yoktur — privileged veya
      # network_mode: host KULLANILMAZ. Dizin sadece bu iki tarafa acik
      # (root:10001, 0770); infra/appliance/setup-appliance.sh olusturur.
      # VPS kurulumlarinda dizin bos kalir, appliance modu kapali gorunur.
      - /var/lib/e1-grid/net:/var/lib/e1-grid/net
      # Gateway kurulum ajani (e1-gwd) ile tek temas noktasi. Backend Docker
      # soketini GORMEZ; buraya bir JSON istegi yazar, gerisini host'taki ajan
      # yapar ve compose'u kendi kurallariyla yeniden dogrular.
      # infra/appliance/setup-gateway-agent.sh olusturur (root:10001, 0770).
      - /var/lib/e1-grid/gw:/var/lib/e1-grid/gw
      # Uzaktan bakim izni ajani (e1-rad) ile TEK temas noktasi. Backend
      # tailscale ikilisini GORMEZ; buraya bir JSON istegi yazar, ajan sureyi
      # kendi saatinden hesaplar ve kendi ust siniriyla kirpar.
      # DIKKAT: izin belgesinin (lease) durdugu /var/lib/e1-grid/remote-priv
      # BILEREK MOUNT EDILMEZ — 0770 bir dizinde yazma izni olan backend,
      # icindeki root'a ait dosyalari da unlink/rename edebilir; yani kendine
      # izin uydurabilir ya da bitis tarihini silebilirdi.
      # infra/appliance/setup-remote-access.sh olusturur (root:10001, 0770).
      - /var/lib/e1-grid/remote:/var/lib/e1-grid/remote
      # Cevrimdisi harita karolari. Named volume: imaj guncellemesinde
      # SILINMEZ -- sahada tekrar indirmek 4G uzerinden pahali/uzun olur.
      - map-tile-data:/var/lib/e1-map-tiles
    networks:
      - e1-net
    logging: *default-logging
    <<: *backend-resources

  # ---------------------------------------------------------------------
  # Arka plan isleri — AYRI SUREC (VARSAYILAN OLARAK ACIK)
  #
  # NE YAPAR: telemetri tuketicisi, outbox yayini, retention/purge, historian,
  # MQTT/webhook cikisi, IEC 104 sunuculari, toplu bildirim, yedekleme — yani
  # `leader.register(...)` ile kayitli TUM isler burada kosar. `backend-api`
  # yalnizca HTTP/WS servis eder.
  #
  # NEDEN AYRI SUREC (olcum, 100 cihaz / 176 sinyal test sunucusu)
  # --------------------------------------------------------------
  # Isler HTTP ile ayni surecte iken backend-api %105 CPU'da olculdu. CPython
  # tek GIL tuttugu icin bu pratikte TAVAN: container'in cgroup tavani 2.0 CPU
  # olmasina ragmen tek surec bir cekirdegin otesine gecemez. Ingest (HTTP,
  # ucuz) ile isleme (tuketici + outbox + retention, pahali) ayni GIL icin
  # yarisiyordu; gateway 1135 msg/sn basarken backend ~480 msg/sn isliyor ve
  # kuyruk sessizce birikiyordu.
  #
  # BU BLOK ONCEDEN `profiles: ["scale"]` ILE KAPALIYDI ve acilmasi `.env`e
  # elle yazilacak uc satira bagliydi. Sahada hicbiri yazilmadi — yani
  # ayirmanin KAZANCI HIC DEVREYE GIRMEDI, yalnizca kodu tasindi. Bir
  # optimizasyonun varsayilani kapaliysa o optimizasyon yoktur.
  #
  # TEK YAYINCI GARANTISI — IKI KATMAN
  # ----------------------------------
  # 1. ROL: `backend-api` varsayilan `api` rolunde. `wants_background()` False
  #    doner, yani o surec advisory lock'u TALEP BILE ETMEZ. Ayni outbox'i iki
  #    yerden yayinlama ihtimali yarisa girmeden ortadan kalkar.
  # 2. ADVISORY LOCK: yine de yerinde duruyor (app/core/service_role.py).
  #    Gerekli, cunku backend-worker'in yeniden baslatilmasi sirasinda eski ve
  #    yeni surec kisa sure UST USTE binebilir; ayrica biri `.env`e
  #    `E1_BACKEND_ROLE=all` yazarsa iki aday olusur.
  # Ucuncu bir kemer daha var: `flush_outbox` satirlari
  # `FOR UPDATE SKIP LOCKED` ile alir ve `dedup_key` UNIQUE'tir.
  #
  # TEK CONTAINER'A GERI DONUS (kucuk saha / dar bellek):
  #     .env:  E1_BACKEND_ROLE=all
  #     sudo docker compose stop backend-worker && docker compose rm -f backend-worker
  # Bu, backend-api'yi eski `all` davranisina dondurur; kod yolu degismedi.
  #
  # KABUL KRITERI: `/api/v1/health` govdesinde
  #     backend-api    -> background.is_leader == false, role == "api"
  #     backend-worker -> background.is_leader == true,  role == "worker"
  # ve Sistem Durumu > telemetri boru hattinda `backlog` ERIMELI.
  #
  # DB BAGLANTI BUTCESI: E1_API_WORKERS keyfi buyutulmemeli; max_connections
  # hesabi yukarida (postgres servisi) 4 API worker + 1 arka plan surecine
  # gore yapildi. Varsayilan (1 + 1 surec) 100 baglanti ister.
  #
  # BELLEK: bu ikinci container ~175 MiB ek RSS demek (olculen backend-api
  # ayak izi). Tavan `heavy-resources` ile 2G; 8 GB altindaki cihazlarda
  # `E1_BACKEND_ROLE=all` ile geri donun.
  #
  # `extends` KULLANILIYOR — env listesi KOPYALANMIYOR. Kopya olsaydi iki
  # liste zamanla ayrisirdi: worker'a eklenmeyen bir ayar (yeni SMTP alani,
  # yeni NATS parametresi) sessizce yalnizca API'de gecerli olurdu ve fark
  # ancak sahada anlasilirdi. Imaj da AYNI; farkli olan yalnizca
  # `SERVICE_ROLE` env'i — komut (`migrate_db && uvicorn`) ortak ve es zamanli
  # migration `pg_advisory_lock` ile seri kosuyor (scripts/migrate_db.py).
  #
  # DIKKAT: compose `extends` ile `depends_on` KOPYALANMAZ; asagida acikca
  # tekrar tanimlanmistir.
  backend-worker:
    extends:
      service: backend-api
    container_name: e1-grid-backend-worker
    # Trafik almaz: port yayinlanmaz, nginx bu servise yonlendirmez.
    # HTTP saglik ucu yine ayakta (uvicorn calisiyor) ama LB'ye girmez.
    environment:
      SERVICE_ROLE: worker
      # Telemetri tuketicisi artik LEADER'SIZ, surec basina calisir
      # (bkz. main.py) — surec sayisi persist kapasitesini DOGRUDAN
      # carpar. Leader-kilitli isler (retention vb.) yine tekil kalir.
      UVICORN_WORKERS: ${E1_WORKER_PROCESSES:-4}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nats:
        condition: service_healthy

  tag-engine:
    build:
      context: ./apps/tag-engine
      dockerfile: Dockerfile
    image: ${E1_REGISTRY:-ghcr.io/enerjione/enerjione-grid}/tag-engine:${E1_VERSION:-latest}
    container_name: e1-grid-tag-engine
    restart: unless-stopped
    volumes: *nats-certs
    depends_on:
      nats:
        condition: service_healthy
      # Backend stream'leri ensure ediyor (jetstream_bus.start_bus_if_enabled).
      # Tag-engine subscribe ederken stream var olmali; backend healthy bekle.
      backend-api:
        condition: service_healthy
    environment:
      # Tag-engine artik tamamen NATS JetStream uzerinde calisiyor.
      # In: TELEMETRY_RAW stream (e1.telemetry.raw.>)
      # Out: e1.telemetry.normalized.<gw> (TELEMETRY_NORMALIZED stream'e gider)
      NATS_URL: ${NATS_URL_WORKER:-${NATS_URL:-nats://nats:4222}}
      # TLS CA dosyasi. BOS = TLS kapali (varsayilan, bugunku davranis).
      # Doluysa baglanti YALNIZCA bu CA'ya guvenir; isletim sisteminin
      # guven deposu kullanilmaz. Acmak icin once sertifika uretin:
      #   sudo bash infra/scripts/linux/nats-tls-setup.sh
      # sonra .env'e NATS_TLS_ENABLED=true + NATS_CA_FILE=/etc/nats/certs/ca.crt
      # ve NATS_URL'i tls:// semasina cevirin.
      NATS_CA_FILE: ${NATS_CA_FILE:-}
      NATS_SUBJECT_TELEMETRY_RAW: ${NATS_SUBJECT_TELEMETRY_RAW:-e1.telemetry.raw.>}
      NATS_SUBJECT_NORMALIZED_PREFIX: ${NATS_SUBJECT_NORMALIZED_PREFIX:-e1.telemetry.normalized}
      # HAT SINIFLANDIRMASI icin sinyal katalogu. Konu son token'i
      # (prio/bulk) buradan cikar; kodda sinyal adi listesi YOK.
      # Katalog cekilemezse TUM olcumler oncelikli hatta akar — yani en kotu
      # durum eski davranistir (tek hat), sessiz bir gerileme degil.
      BACKEND_API_BASE: http://backend-api:8000/api/v1
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      SIGNAL_CATALOG_REFRESH_SEC: ${SIGNAL_CATALOG_REFRESH_SEC:-60}
      SIGNAL_CATALOG_TIMEOUT_SEC: ${SIGNAL_CATALOG_TIMEOUT_SEC:-5}
      # Paralel yayin penceresi + teslim tavani — buyuk replay'de buyutulur.
      TAG_PUBLISH_PARALLEL: ${TAG_PUBLISH_PARALLEL:-512}
      TAG_MAX_ACK_PENDING: ${TAG_MAX_ACK_PENDING:-10000}
      # Backend system-status, tag-engine icin 8011 portunu probe eder.
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: 8011
    networks:
      - e1-net
    logging: *default-logging
    <<: [*tag-engine-resources, *hardened-worker]

  # tag-engine REPLIKASI — queue-group ile ayni durable'i paylasir, mesajlari
  # BOLUSUR (yatay olcek). Tek asyncio sureci ~1 cekirdegi asamaz; 400+
  # cihazda normalize tavani boyle ikiye katlanir. `extends` depends_on'u
  # TASIMAZ (compose spec) — yeniden bildirilir.
  tag-engine-b:
    extends:
      service: tag-engine
    container_name: e1-grid-tag-engine-b
    depends_on:
      nats:
        condition: service_healthy
      backend-api:
        condition: service_healthy
      # Ilk kopya durable devrini yapsin, replika hazir duruma baglansin.
      tag-engine:
        condition: service_started

  alarm-service:
    build:
      context: ./apps/alarm-service
      dockerfile: Dockerfile
    image: ${E1_REGISTRY:-ghcr.io/enerjione/enerjione-grid}/alarm-service:${E1_VERSION:-latest}
    container_name: e1-grid-alarm-service
    restart: unless-stopped
    volumes: *nats-certs
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend-api:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      # Telemetri kaynagi: NATS JetStream (tag-engine cikisi).
      NATS_URL: ${NATS_URL_WORKER:-${NATS_URL:-nats://nats:4222}}
      # TLS CA dosyasi. BOS = TLS kapali (varsayilan, bugunku davranis).
      # Doluysa baglanti YALNIZCA bu CA'ya guvenir; isletim sisteminin
      # guven deposu kullanilmaz. Acmak icin once sertifika uretin:
      #   sudo bash infra/scripts/linux/nats-tls-setup.sh
      # sonra .env'e NATS_TLS_ENABLED=true + NATS_CA_FILE=/etc/nats/certs/ca.crt
      # ve NATS_URL'i tls:// semasina cevirin.
      NATS_CA_FILE: ${NATS_CA_FILE:-}
      NATS_SUBJECT_TELEMETRY_NORMALIZED: ${NATS_SUBJECT_TELEMETRY_NORMALIZED:-e1.telemetry.normalized.>}
      # IKI HAT — alarm URETEN yol oncelikli hatta. Oncelikli hattin kuyruk
      # tavani (`max_ack_pending`) kucuk tutulur: buyuk tutmak, ayirdigimiz
      # hattin icine yeniden kuyruk kurmak olurdu.
      NATS_STREAM_TELEMETRY_NORMALIZED: ${NATS_STREAM_TELEMETRY_NORMALIZED:-TELEMETRY_NORMALIZED}
      NATS_ALARM_ACK_PENDING_PRIO: ${NATS_ALARM_ACK_PENDING_PRIO:-500}
      NATS_ALARM_ACK_PENDING_BULK: ${NATS_ALARM_ACK_PENDING_BULK:-10000}
      # Alarm yayini: RabbitMQ (notification-worker buradan tuketiyor).
      # Vhost izolasyonu: kok `/` vhost'a degil dedicated `e1` (veya
      # `${RABBITMQ_VHOST}`) altinda calisilir. Backend startup'ta admin
      # API uzerinden idempotent ensure eder.
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-hsl}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-e1}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-e1}
      RABBITMQ_EXCHANGE: e1.events
      RABBITMQ_DLX_EXCHANGE: e1.events.dlx
      BACKEND_API_BASE: http://backend-api:8000/api/v1
      BACKEND_INTERNAL_ALARM_URL: http://backend-api:8000/api/v1/internal/alarms
      BACKEND_INTERNAL_ALARM_CLEAR_URL: http://backend-api:8000/api/v1/internal/alarms/clear
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: 8012
    networks:
      - e1-net
    logging: *default-logging
    <<: [*alarm-resources, *hardened-worker]

  notification-worker:
    build:
      context: ./apps/notification-worker
      dockerfile: Dockerfile
    image: ${E1_REGISTRY:-ghcr.io/enerjione/enerjione-grid}/notification-worker:${E1_VERSION:-latest}
    container_name: e1-grid-notification-worker
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      # Backend `/internal/notifications/dispatch/{alarm_id}` cagriliyor;
      # backend healthy olmadan worker mesajlari requeue eder, broker doluyu.
      backend-api:
        condition: service_healthy
    environment:
      # Vhost izolasyonu: kok `/` vhost'a degil dedicated `e1` (veya
      # `${RABBITMQ_VHOST}`) altinda calisilir. Backend startup'ta admin
      # API uzerinden idempotent ensure eder.
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-hsl}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-e1}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-e1}
      RABBITMQ_EXCHANGE: e1.events
      RABBITMQ_DLX_EXCHANGE: e1.events.dlx
      BACKEND_API_BASE: http://backend-api:8000/api/v1
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: 8013
    networks:
      - e1-net
    logging: *default-logging
    <<: [*worker-resources, *hardened-worker]

  iec104-outbound:
    build:
      context: ./apps/iec104-outbound
      dockerfile: Dockerfile
    image: ${E1_REGISTRY:-ghcr.io/enerjione/enerjione-grid}/iec104-outbound:${E1_VERSION:-latest}
    container_name: e1-grid-iec104-outbound
    restart: unless-stopped
    volumes: *nats-certs
    depends_on:
      backend-api:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      # Telemetri kaynagi: NATS JetStream (tag-engine cikisi).
      NATS_URL: ${NATS_URL_WORKER:-${NATS_URL:-nats://nats:4222}}
      # TLS CA dosyasi. BOS = TLS kapali (varsayilan, bugunku davranis).
      # Doluysa baglanti YALNIZCA bu CA'ya guvenir; isletim sisteminin
      # guven deposu kullanilmaz. Acmak icin once sertifika uretin:
      #   sudo bash infra/scripts/linux/nats-tls-setup.sh
      # sonra .env'e NATS_TLS_ENABLED=true + NATS_CA_FILE=/etc/nats/certs/ca.crt
      # ve NATS_URL'i tls:// semasina cevirin.
      NATS_CA_FILE: ${NATS_CA_FILE:-}
      NATS_SUBJECT_TELEMETRY_NORMALIZED: ${NATS_SUBJECT_TELEMETRY_NORMALIZED:-e1.telemetry.normalized.>}
      BACKEND_API_BASE: http://backend-api:8000/api/v1
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: 8014
      IEC104_DEFAULT_LISTEN_HOST: 0.0.0.0
    # IEC 104 outbound master sistemler bu portlara baglanir.
    # Buradaki aralik (2404 standart, 2405-2410 ek hedefler) kullaniciya gore
    # genisletilebilir; backend'deki outbound_targets icindeki listen_port
    # bu araliga dusmeli.
    ports:
      - "2404:2404"
      - "2405:2405"
      - "2406:2406"
    networks:
      - e1-net
    logging: *default-logging
    <<: [*worker-resources, *hardened-worker]

  # Modbus TCP outbound — sinyalleri Modbus register/bit adreslerine yayinlar.
  # IEC104 gibi backend'den BAGIMSIZ ayri bir servis: SCADA'nin tarama hizi
  # (saniyede yuzlerce istek olabilir) backend'i veya telemetri akisini
  # etkilemez. Adres planini backend'den ceker, kendisi hesaplamaz.
  modbus-outbound:
    build:
      context: ./apps/modbus-outbound
      dockerfile: Dockerfile
    image: ${E1_REGISTRY:-ghcr.io/enerjione/enerjione-grid}/modbus-outbound:${E1_VERSION:-latest}
    container_name: e1-grid-modbus-outbound
    restart: unless-stopped
    volumes: *nats-certs
    depends_on:
      backend-api:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      NATS_URL: ${NATS_URL_WORKER:-${NATS_URL:-nats://nats:4222}}
      # TLS CA dosyasi. BOS = TLS kapali (varsayilan, bugunku davranis).
      # Doluysa baglanti YALNIZCA bu CA'ya guvenir; isletim sisteminin
      # guven deposu kullanilmaz. Acmak icin once sertifika uretin:
      #   sudo bash infra/scripts/linux/nats-tls-setup.sh
      # sonra .env'e NATS_TLS_ENABLED=true + NATS_CA_FILE=/etc/nats/certs/ca.crt
      # ve NATS_URL'i tls:// semasina cevirin.
      NATS_CA_FILE: ${NATS_CA_FILE:-}
      NATS_SUBJECT_TELEMETRY_NORMALIZED: ${NATS_SUBJECT_TELEMETRY_NORMALIZED:-e1.telemetry.normalized.>}
      BACKEND_API_BASE: http://backend-api:8000/api/v1
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: 8017
      MODBUS_DEFAULT_LISTEN_HOST: 0.0.0.0
    # Modbus standart portu 502'dir ve <1024'tur. Servis non-root (uid 10001)
    # calistigi ve `cap_drop: ALL` uygulandigi icin bu sysctl olmadan bind
    # edemez. Namespace'e ozel bir ayardir; host'un port politikasini
    # DEGISTIRMEZ, sadece bu container icinde gecerlidir.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    ports:
      # SCADA sistemleri bu portlara baglanir. Hedefin `listen_port` degeri
      # buradaki araliktan biri olmali; baska port kullanilacaksa bu listeye
      # eklenmeli (IEC104'teki 2404-2406 mantiginin aynisi).
      - "502:502"
      - "5020:5020"
      - "5021:5021"
    networks:
      - e1-net
    logging: *default-logging
    <<: [*worker-resources, *hardened-worker]

  # Gomulu FTP sunucusu — Horstmann SN2 cihazlari config/firmware dosyalarini
  # buraya yazar/okur (cihaz FTP ekrani: Server/Port 21/User/Pass/Dir).
  # NOT: `*hardened-worker` KULLANILMAZ — FTP writable volume'a yazar (read_only
  # olamaz) ve port 21 + pasif veri portlarini bind eder (cap_drop:ALL, port 21
  # <1024 root bind engellenir). Bu yuzden inline, sadelestirilmis guvenlik.
  ftp-server:
    build:
      context: ./apps/ftp-server
      dockerfile: Dockerfile
    image: ${E1_REGISTRY:-ghcr.io/enerjione/enerjione-grid}/ftp-server:${E1_VERSION:-latest}
    container_name: e1-grid-ftp-server
    restart: unless-stopped
    environment:
      FTP_USER: ${FTP_USER:-device}
      FTP_PASSWORD: ${FTP_PASSWORD}
      FTP_ROOT: /data/ftp
      FTP_LISTEN_PORT: 21
      FTP_PASV_MIN_PORT: ${FTP_PASV_MIN_PORT:-30000}
      FTP_PASV_MAX_PORT: ${FTP_PASV_MAX_PORT:-30009}
      # NAT arkasindaki cihazlar pasif modda dis IP gormeli. Bos ise otomatik.
      FTP_MASQUERADE_ADDRESS: ${FTP_MASQUERADE_ADDRESS:-}
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: 8015
    ports:
      # Kontrol portu + pasif veri portu araligi (cihazlar bu araliga baglanir).
      - "${FTP_HOST_PORT:-21}:21"
      - "${FTP_PASV_MIN_PORT:-30000}-${FTP_PASV_MAX_PORT:-30009}:${FTP_PASV_MIN_PORT:-30000}-${FTP_PASV_MAX_PORT:-30009}"
    volumes:
      # Cihazlarin yazdigi config/firmware — backend/UI bu volume'u okur.
      - ftp-data:/data/ftp
    networks:
      - e1-net
    logging: *default-logging
    <<: *worker-resources

  # WhatsApp Web self-hosted gateway (Baileys) — telefonla QR kod okutup
  # baglanan WhatsApp gonderim kanali. NOT: `*hardened-worker` KULLANILMAZ —
  # oturum dosyalari writable volume'a yazilir (read_only olamaz). Host'a
  # hicbir port expose edilmez, sadece backend internal network'ten erisir.
  whatsapp-web-gateway:
    build:
      context: ./apps/whatsapp-web-gateway
      dockerfile: Dockerfile
    image: ${E1_REGISTRY:-ghcr.io/enerjione/enerjione-grid}/whatsapp-web-gateway:${E1_VERSION:-latest}
    container_name: e1-grid-whatsapp-web-gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      WHATSAPP_SESSION_DIR: /data/session
      WORKER_HEALTH_PORT: 8016
    volumes:
      - whatsapp-session-data:/data/session
    networks:
      - e1-net
    logging: *default-logging
    <<: *worker-resources

  frontend-web:
    build:
      context: ./apps/frontend-web
      dockerfile: Dockerfile
    image: ${E1_REGISTRY:-ghcr.io/enerjione/enerjione-grid}/frontend-web:${E1_VERSION:-latest}
    container_name: e1-grid-frontend-web
    restart: unless-stopped
    depends_on:
      # Healthy bekle: backend yukselemeden frontend baslarsa nginx /api/*
      # icin 502 doner, kullanici bos beyaz ekran gorur. start_period 30sn
      # backend-api healthcheck'inde tanimli.
      #
      # BU BEKLEME ARTIK KISA: /health yalnizca Postgres'i kritik sayiyor
      # (app/api/health.py). Eskiden NATS/JetStream de kritikti ve kuyruktaki
      # tek bir yanlis yapilandirma backend'i KALICI unhealthy birakip bu
      # satir yuzunden arayuzun HIC acilmamasina yol aciyordu. Kalan tek
      # blokaj Postgres'tir; o da gercekten dustuyse uygulama zaten calisamaz.
      backend-api:
        condition: service_healthy
    ports:
      # VDS'in 80 portu — kullanici browser'i buraya baglanir; nginx hem SPA'i
      # serve eder hem /api/* isteklerini backend-api:8000'e proxy eder.
      # Container icinde nginx-unprivileged 8080'de calisir (non-root uid 101);
      # host'a hala 80 (varsayilan) ile expose ediyoruz.
      - "${FRONTEND_HTTP_PORT:-80}:8080"
    networks:
      - e1-net
    logging: *default-logging
    <<: [*worker-resources, *hardened-worker]

networks:
  e1-net:
    driver: bridge

volumes:
  map-tile-data:
  postgres-data:
  rabbitmq-data:
  nats-data:
  backup-data:
  # Imzali lisans + kurulum kimligi. DB backup'ina dahil degil; makineye bagli.
  license-data:
  # Cihazlarin FTP ile yazdigi config/firmware dosyalari (ftp-server + backend okur).
  ftp-data:
  # WhatsApp Web oturum dosyalari (Baileys useMultiFileAuthState). DB backup'ina
  # dahil degil; kaybolursa sadece yeniden QR okutmak gerekir.
  whatsapp-session-data:
