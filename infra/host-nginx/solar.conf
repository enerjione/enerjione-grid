# EnerjiOne Solar — host nginx reverse proxy config
# /etc/nginx/sites-available/solar
#
# Solar docker stack frontend-web localhost:8081'de bind. Bu config
# subdomain matcher + pass-through; container icindeki nginx /api/ proxy +
# /api/v1/ws/ WebSocket upgrade'i zaten yapiyor.

upstream solar_backend {
    server 127.0.0.1:8081;
    keepalive 16;
}

map $http_upgrade $solar_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name solar.fikretsafak.com.tr;

    client_max_body_size 100M;

    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 30s;
    proxy_buffering off;

    access_log /var/log/nginx/solar.access.log;
    error_log  /var/log/nginx/solar.error.log warn;

    location / {
        proxy_pass http://solar_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $solar_connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
