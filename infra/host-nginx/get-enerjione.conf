# Kisa kurulum adresi — get.enerjione.com
# /etc/nginx/sites-available/get-enerjione
#
# AMAC
# ----
# Sahadaki kurulumcunun ezberleyip yazabilecegi tek satirlik komut:
#
#     curl -fsSL get.enerjione.com | sudo bash
#
# yerine:
#
#     curl -fsSL https://raw.githubusercontent.com/enerjione/enerjione-grid/main/install.sh | sudo bash
#
# Docker (get.docker.com), k3s, Rust ve Homebrew ayni kalibi kullanir.
#
# NASIL CALISIR
# -------------
# Icerik burada TUTULMAZ; istek GitHub'daki install.sh'a 302 ile yonlendirilir.
# Boylece VPS'te guncel tutulacak bir kopya olusmaz — repo'ya push edilen
# script aninda gecerli olur. `curl -L` (install komutundaki -L) yonlendirmeyi
# otomatik izler.
#
# ON KOSUL
# --------
#   1. DNS A kaydi:  get.enerjione.com  ->  <VPS-IP>
#   2. Bu dosyayi sites-available'a kopyalayip enable edin:
#        sudo cp get-enerjione.conf /etc/nginx/sites-available/get-enerjione
#        sudo ln -sf /etc/nginx/sites-available/get-enerjione \
#                    /etc/nginx/sites-enabled/get-enerjione
#        sudo nginx -t && sudo systemctl reload nginx
#   3. Test:
#        curl -IL get.enerjione.com        # 302 -> 200 ve script icerigi
#
# SSL (opsiyonel ama onerilir)
# ----------------------------
#   sudo certbot --nginx -d get.enerjione.com
#
# HTTPS acildiktan sonra da `curl -fsSL get.enerjione.com` calisir: curl once
# http'ye baglanir, certbot'un ekledigi 301 ile https'e ciker, oradan da
# GitHub'a yonlenir.

# Yonlendirme hedefi. Branch degisirse SADECE burasi guncellenir.
map $host $e1_install_script {
    default "https://raw.githubusercontent.com/enerjione/enerjione-grid/main/install.sh";
}

server {
    listen 80;
    listen [::]:80;
    server_name get.enerjione.com;

    access_log /var/log/nginx/get-enerjione.access.log;
    error_log  /var/log/nginx/get-enerjione.error.log warn;

    # Let's Encrypt HTTP-01 dogrulamasi certbot tarafindan buraya eklenir;
    # asagidaki genel yonlendirme onu golgelemesin diye ayri location.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Kok istek -> kurulum scripti.
    location = / {
        return 302 $e1_install_script;
    }

    # Yaygin yazim varyantlari da ayni yere gitsin: kurulumcu ezberden
    # "get.enerjione.com/install" yazarsa 404 almasin.
    location = /install     { return 302 $e1_install_script; }
    location = /install.sh  { return 302 $e1_install_script; }

    # Geri kalan her sey -> kok. Yanlis yazim sessiz 404 yerine calisan
    # komuta dusur; `curl | bash` icin 404 govdesi tehlikeli olabilir
    # (bash bos/HTML govdeyi calistirmaya calisir).
    location / {
        return 302 https://$host/;
    }
}
