# EnerjiOne Grid — host nginx reverse proxy config
# /etc/nginx/sites-available/enerjione-grid
#
# Bu config Docker compose icindeki frontend-web container'ina (localhost:8080)
# trafik yonlendirir. WebSocket upgrade ve API proxy zaten container icindeki
# nginx'te yapiliyor — biz sadece subdomain matcher + pass-through ekliyoruz.

upstream enerjione_grid_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Map for WebSocket Upgrade header
map $http_upgrade $eo_grid_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name grid.enerjione.com;

    # Yedek upload + sertifika upload icin.
    #
    # ZINCIRDEKI EN DUSUK DEGER KAZANIR — uc katman da hizali olmali:
    #   host nginx (burasi)      : 2 GiB
    #   ic nginx (frontend-web)  : 2 GiB  (apps/frontend-web/nginx.conf)
    #   backend                  : 2 GiB  (_BACKUP_UPLOAD_MAX_BYTES)
    # Biri dusuk kalirsa backend'in streaming/413 mantigi hic calismaz; istek
    # uvicorn'a ulasmadan nginx'in HTML 413'uyle reddedilir ve frontend JSON
    # bekledigi icin kullaniciya anlamsiz genel bir hata gosterilir.
    client_max_body_size 2G;

    # Govdeyi diske tamponlama — 2 GiB'lik bir yukleme /var/lib/nginx'i
    # doldurmasin ve akis dogrudan backend'e gitsin.
    proxy_request_buffering off;

    # Genel istek timeout — uzun pg_restore akislari icin
    proxy_read_timeout    1800s;
    proxy_send_timeout    1800s;
    proxy_connect_timeout 30s;

    # Buffering kapali — Server-Sent Events / streaming icin
    proxy_buffering off;

    access_log /var/log/nginx/enerjione-grid.access.log;
    error_log  /var/log/nginx/enerjione-grid.error.log warn;

    location / {
        proxy_pass http://enerjione_grid_backend;
        proxy_http_version 1.1;

        # WebSocket destegi (canli telemetri /api/v1/ws/...)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $eo_grid_connection_upgrade;

        # Standart proxy header'lari
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
