# Kurulum adresi — https://enerjione.com/grid/install.sh
#
# HEDEF
# -----
#     curl -fsSL https://enerjione.com/grid/install.sh | sudo bash
#
# Tailscale (tailscale.com/install.sh), Docker (get.docker.com) ve Rust ayni
# kalibi kullanir: kisa, marka altinda, ezberlenebilir.
#
# NEDEN YONLENDIRME DEGIL, DOSYA
# ------------------------------
# Onceki surum GitHub'a 302 atiyordu. Depo PRIVATE oldugu icin bu artik
# CALISMAZ: raw.githubusercontent.com kimliksiz istemciye 404 doner ve
# `curl | bash` bos/HTML govdeyi calistirmaya kalkar. Script kendi
# sunucumuzdan servis edilir; ayrica GitHub kesintisi ve rate limit'ten de
# bagimsiziz.
#
# Dosyalari `infra/scripts/linux/publish-installer.sh` yerlestirir
# (update.sh VDS'te her guncellemede otomatik cagirir).
#
# ---------------------------------------------------------------------------
# ONEMLI — BU DOSYA BIR `server` BLOGU DEGIL, `location` PARCASIDIR
# ---------------------------------------------------------------------------
# `enerjione.com` ana sitesi ayni VDS'te Node/Express (127.0.0.1:3000) olarak
# calisiyor ve kendi nginx server blogu var (enerjione-web deposu,
# infra/nginx/enerjione.com.conf). Burada ikinci bir `server_name
# enerjione.com` blogu tanimlarsak nginx "conflicting server name" uyarisi
# verir ve ikisinden biri SESSIZCE yok sayilir — hangisi oldugu nginx'in
# yukleme sirasina kalir. Bu yuzden asagidakiler ana sitenin 443 blogunun
# ICINE dahil edilir.
#
# KURULUM
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp grid-public.conf /etc/nginx/snippets/e1-grid-public.conf
#
#   Ana sitenin 443 server blogu icine (enerjione-web deposunda zaten ekli):
#       include /etc/nginx/snippets/e1-grid-public.conf;
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# `location` yolu `location /` proxy'sinden ONCE eslesir (tam eslesme `=` ve
# `^~` her zaman prefix proxy'yi yener), yani /grid/* diskten servis edilir,
# geri kalan her sey Node'a gider.
#
# DOGRULAMA
#   curl -fsS https://enerjione.com/grid/install.sh | head -3
#   curl -fsS https://enerjione.com/grid/version.json

# --- Kurulum scripti ------------------------------------------------------
location = /grid/install.sh {
    alias /var/www/enerjione-grid-public/install.sh;
    # text/plain: tarayicida acildiginda indirmek yerine gosterir;
    # `curl | bash` icin de dogru tur.
    default_type text/plain;
    # Script her yayinda degisir; ara katmanlar eski surumu tutmasin.
    add_header Cache-Control "no-store" always;
}

# --- Ortak kutuphane ------------------------------------------------------
# install.sh `curl | bash` modunda repo klonlamadan once _lib.sh'a ihtiyac
# duyar. Private depo nedeniyle GitHub'dan cekilemez.
location = /grid/_lib.sh {
    alias /var/www/enerjione-grid-public/_lib.sh;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
}

# --- Surum manifesti ------------------------------------------------------
# Backend'in UPDATE_CHECK_URL'i bunu okur. Depo private oldugu icin GitHub
# Releases API kimliksiz calismaz; manifest onun yerini tutar.
location = /grid/version.json {
    alias /var/www/enerjione-grid-public/version.json;
    default_type application/json;
    # 5 dakika cache: saha cihazlari 6 saatte bir soruyor, yine de ust uste
    # gelen isteklerde diski mesgul etmeyelim.
    add_header Cache-Control "public, max-age=300" always;
}

# --- Kisa yazim varyantlari -----------------------------------------------
# Kurulumcu ezberden eksik yazarsa 404 almasin. `curl | bash` icin 404
# govdesi tehlikelidir: bash HTML'i calistirmaya kalkar.
location = /grid          { return 302 https://$host/grid/install.sh; }
location = /grid/         { return 302 https://$host/grid/install.sh; }
location = /grid/install  { return 302 https://$host/grid/install.sh; }
