# Kurulum adresi — https://enerjione.com/grid/install.sh
#
# HEDEF
# -----
#     curl -fsSL https://enerjione.com/grid/install.sh | sudo bash
#
# Tailscale (tailscale.com/install.sh), Docker (get.docker.com) ve Rust ayni
# kalibi kullanir: kisa, marka altinda, ezberlenebilir.
#
# NEDEN YONLENDIRME DEGIL, DOSYA
# ------------------------------
# Onceki surum GitHub'a 302 atiyordu. Depo PRIVATE oldugu icin bu artik
# CALISMAZ: raw.githubusercontent.com kimliksiz istemciye 404 doner ve
# `curl | bash` bos govdeyi calistirmaya kalkar. Script kendi sunucumuzdan
# servis edilir; ayrica GitHub kesintisi ve rate limit'ten de bagimsiziz.
#
# Dosyalari `infra/scripts/linux/publish-installer.sh` yerlestirir
# (update.sh VDS'te otomatik cagirir).
#
# KURULUM
# -------
# Bu dosya iki sekilde kullanilabilir:
#
#   A) enerjione.com zaten baska bir site tarafindan servis ediliyorsa,
#      o server blogunun ICINE su satiri ekleyin:
#          include /etc/nginx/snippets/e1-grid-public.conf;
#      ve bu dosyanin `location` bloklarini oraya kopyalayin
#      (setup-host-nginx.sh bunu otomatik yapar).
#
#   B) enerjione.com bu VPS'te bos ise asagidaki server blogu dogrudan
#      kullanilabilir.
#
# DOGRULAMA
#   curl -fsS https://enerjione.com/grid/install.sh | head -3
#   curl -fsS https://enerjione.com/grid/version.json

server {
    listen 80;
    listen [::]:80;
    server_name enerjione.com www.enerjione.com get.enerjione.com;

    access_log /var/log/nginx/e1-grid-public.access.log;
    error_log  /var/log/nginx/e1-grid-public.error.log warn;

    # certbot HTTP-01 dogrulamasi — asagidaki bloklar golgelemesin.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # --- Kurulum scripti --------------------------------------------------
    # `alias` kullaniyoruz: /grid/ onekini dosya yolundan dusurur, boylece
    # web koku /grid/ alt dizini icermek zorunda kalmaz.
    location = /grid/install.sh {
        alias /var/www/enerjione-grid-public/install.sh;
        # text/plain: tarayicida acildiginda indirmek yerine gosterir;
        # `curl | bash` icin de dogru tur.
        default_type text/plain;
        # Script her yayinda degisir; ara katmanlar eski surumu tutmasin.
        add_header Cache-Control "no-store" always;
    }

    # --- Ortak kutuphane --------------------------------------------------
    # install.sh `curl | bash` modunda repo klonlamadan once _lib.sh'a
    # ihtiyac duyar. Private depo nedeniyle GitHub'dan cekilemez.
    location = /grid/_lib.sh {
        alias /var/www/enerjione-grid-public/_lib.sh;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # --- Surum manifesti --------------------------------------------------
    # Backend'in UPDATE_CHECK_URL'i bunu okur. Depo private oldugu icin
    # GitHub Releases API kimliksiz calismaz; manifest onun yerini tutar.
    location = /grid/version.json {
        alias /var/www/enerjione-grid-public/version.json;
        default_type application/json;
        # 5 dakika cache: saha cihazlari 6 saatte bir soruyor, yine de
        # ust uste gelen isteklerde diski mesgul etmeyelim.
        add_header Cache-Control "public, max-age=300" always;
    }

    # --- Kisa yazim varyantlari -------------------------------------------
    # Kurulumcu ezberden eksik yazarsa 404 almasin. `curl | bash` icin 404
    # govdesi tehlikelidir: bash HTML'i calistirmaya kalkar.
    location = /grid          { return 302 https://$host/grid/install.sh; }
    location = /grid/         { return 302 https://$host/grid/install.sh; }
    location = /grid/install  { return 302 https://$host/grid/install.sh; }

    # get.enerjione.com kok istegi de kuruluma gitsin (eski adres uyumu).
    location = / {
        if ($host = get.enerjione.com) {
            return 302 https://enerjione.com/grid/install.sh;
        }
        return 404;
    }
}
