# RabbitMQ — URUN FARKINDA DISK ESIGI
#
# NEDEN BU DOSYA VAR
# ------------------
# RabbitMQ'nun `disk_free_limit` VARSAYILANI 50 MB'dir. Sahada olculdu
# (192.168.2.99, 456 GB disk): RabbitMQ ancak diskte 50 MB kalinca alarm
# uretir ve yayincilari bloklar. Yani 456 GB'lik bir diskte alarm %99,99
# dolulukta calar — Disk Guardian'in ACIL esiginden (%95 dolu / ~23 GB bos)
# cok SONRA. Bir koruma katmani olarak fiilen oludur: o noktaya gelindiginde
# PostgreSQL zaten yazamiyor, yedek alinamiyor ve JetStream tavana carpmis
# olur.
#
# HEDEF SIRALAMA (kucukten buyuge bos alan):
#     50 MB  ...... RabbitMQ VARSAYILANI  (cok gec — kullanilmiyor)
#     10 GB  ...... Disk Guardian ACIL
#     20 GB  ...... BU DOSYA: RabbitMQ disk alarmi        <-- once calar
#     25 GB  ...... Disk Guardian KRITIK
#     50 GB  ...... Disk Guardian UYARI
#
# RabbitMQ'nun kendi alarmi Disk Guardian'in ACIL seviyesinden ONCE
# tetiklenmeli ki, yayincilar bloklandiginda operator bunu bir SURPRIZ
# olarak degil, zaten gormekte oldugu disk uyarisinin devami olarak yasasin.
#
# NEDEN MUTLAK DEGER, YUZDE DEGIL: RabbitMQ'nun `disk_free_limit.relative`
# secenegi RAM'e goredir (disk boyutuna DEGIL) — 16 GB RAM'li saha
# cihazinda `relative = 1.0` yalnizca 16 GB eder ve disk buyudukce
# olceklenmez. Mutlak deger burada daha dogru ve daha okunabilir.
#
# BU DOSYA NEYI DEGISTIRMEZ: ag dinleme adresleri, TLS, kullanici/parola,
# yetkilendirme. Onlar Network Security kapsamidir ve burada YOKTUR.
#
# DEGER NEDEN SABIT: `rabbitmq.conf` ortam degiskeni ARA DEGERLEME YAPMAZ
# (`${VAR:-default}` compose sozdizimidir, RabbitMQ onu duz metin olarak
# okur ve acilista "invalid value" ile duser). Farkli bir deger gerekiyorsa
# bu dosya degistirilir; degerin Disk Guardian esikleriyle tutarli kalmasi
# `tests/test_disk_guard_policy.py::test_DG15_*` ile kilitlidir.
disk_free_limit.absolute = 20GB
